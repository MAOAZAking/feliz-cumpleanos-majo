        // --- BOMBILLO EN EL TECHO ---
        function crearBombillo() {
            const grupoLuz = new THREE.Group();
            grupoLuz.position.set(configBombillo.x, configBombillo.y, configBombillo.z);

            // Plafon para el bombillo
            const basePlafon = new THREE.Mesh(new THREE.CylinderGeometry(0.7, 0.7, 0.2), new THREE.MeshStandardMaterial({color: 0xFFFFFF}));
            basePlafon.position.y = 1.5; // Colgando hacia arriba desde el centro del grupo
            const cuerpoPlafon = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 0.2), new THREE.MeshStandardMaterial({color: 0xFFFFFF}));
            cuerpoPlafon.position.y = 1.3; // Colgando hacia arriba desde el centro del grupo
            grupoLuz.add(basePlafon, cuerpoPlafon);

            // Bombilla
            // Creamos la roscade la bombilla
            const geoRoscaBombilla = new THREE.CylinderGeometry(0.3, 0.3, 0.07);
            const matRoscaBombilla = new THREE.MeshStandardMaterial({color: 0x9E9E9E}); // Blanco brillante
            const roscaBombilla = new THREE.Mesh(geoRoscaBombilla, matRoscaBombilla);
            roscaBombilla.position.y = 1.15;
            // Creamos el circulo de luz de la bombilla
            const geoEsferaBombilla = new THREE.SphereGeometry(0.5, 16, 16);
            const matEsferaBombilla = new THREE.MeshBasicMaterial({ color: 0xFFFFFF }); // Blanco brillante
            const esferaBombilla = new THREE.Mesh(geoEsferaBombilla, matEsferaBombilla);
            esferaBombilla.position.y = 0.7;
            grupoLuz.add(roscaBombilla, esferaBombilla);

            // Luz PointLight que emana del bombillo
            const luz = new THREE.PointLight(0xFFFFFF, 1.5, 30); // Luz blanca, más intensa y con más alcance
            luz.castShadow = !isMobile;
            grupoLuz.add(luz);
            grupoLuz.position.z = 1;

            escena.add(grupoLuz);
        }
        crearBombillo();

        // EL ENTORNO BASE YA ESTÁ LISTO (Habitación, Mesa, Pastel, Bombillo)
        verificarListo();

        // 5. Texto y Velas (Cargamos fuente)
        // 5.1 Función para crear el Reloj (se llama dentro del loader)
        function crearReloj(font) {
            const grupoReloj = new THREE.Group();
            // Posición en la pared de ondas (Atrás, Z=-19.5 aprox), bien arriba
            grupoReloj.position.set(0, 10, -19.8); // Más pegado a la pared
            escena.add(grupoReloj);

            // --- CONFIGURACIÓN DE COLORES DEL RELOJ ---
            // Cambia estos valores para ajustar los tonos
            const colorGrisClaro = 0x999999; // Gris más oscuro
            const colorGrisOscuro = 0x333333; // "Negro" o gris muy oscuro
            // LISTA: Pon aquí los números que quieres que sean oscuros
            const numerosOscuros = []; 

            // Helper para contornos (Oscurece el color base para la línea)
            const agregarContorno = (mesh, colorHex) => {
                const edges = new THREE.EdgesGeometry(mesh.geometry);
                const colorObj = new THREE.Color(colorHex);
                // Disminuir luminosidad para el contorno
                const colorContorno = colorObj.offsetHSL(0, 0, -0.4); 
                const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: colorContorno }));
                mesh.add(line);
            };

            // Crear Números
            const radio = 5; // Tamaño del reloj
            for(let i=1; i<=12; i++) {
                let textoStr = i.toString();
                // Texto en inglés para los puntos cardinales
                if(i===12) textoStr = "TWELVE";
                if(i===3) textoStr = "THREE";
                if(i===6) textoStr = "SIX";
                if(i===9) textoStr = "NINE";

                // Tamaño de letras ajustado a que tan larga es la palabra
                const tamano = (i%3===0) ? 0.3 : 0.6; // Texto un poco más pequeño si es palabra larga
                const geoNum = new TextGeometry(textoStr, {
                    font: font, size: tamano, height: 0.3, curveSegments: 4
                });
                geoNum.center();

                const angulo = Math.PI/2 - (i * Math.PI / 6); // Ajuste trigonométrico
                const tx = Math.cos(angulo) * radio;
                const ty = Math.sin(angulo) * radio;

                const esOscuro = numerosOscuros.includes(i);
                const colorFinal = esOscuro ? colorGrisOscuro : colorGrisClaro;
                
                const meshNum = new THREE.Mesh(geoNum, new THREE.MeshStandardMaterial({ color: colorFinal }));
                meshNum.position.set(tx, ty, 0);
                agregarContorno(meshNum, colorFinal);
                grupoReloj.add(meshNum);
            }

            // Eje Central
            const eje = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 0.6, 16).rotateX(Math.PI/2), new THREE.MeshStandardMaterial({ color: colorGrisOscuro }));
            agregarContorno(eje, colorGrisOscuro);
            grupoReloj.add(eje);

            // Manecillas
            const matManecilla = new THREE.MeshStandardMaterial({ color: colorGrisOscuro });
            
            // Manecilla de la Hora (Puntuda y recortada 1/4)
            const shapeHora = new THREE.Shape();
            shapeHora.moveTo(-0.125, 0); shapeHora.lineTo(0.125, 0); shapeHora.lineTo(0, 3.4); shapeHora.lineTo(-0.125, 0);
            const geoHora = new THREE.ExtrudeGeometry(shapeHora, { depth: 0.1, bevelEnabled: false });
            manecillaHora = new THREE.Mesh(geoHora, matManecilla);
            manecillaHora.position.z = 0.1;
            agregarContorno(manecillaHora, colorGrisOscuro);
            grupoReloj.add(manecillaHora);

            // Manecilla de los Minutos (Puntuda y recortada 1/4)
            const matMinuto = new THREE.MeshStandardMaterial({ color: colorGrisOscuro });
            const shapeMin = new THREE.Shape();
            shapeMin.moveTo(-0.075, 0); shapeMin.lineTo(0.075, 0); shapeMin.lineTo(0, 4.5); shapeMin.lineTo(-0.075, 0);
            const geoMin = new THREE.ExtrudeGeometry(shapeMin, { depth: 0.1, bevelEnabled: false });
            
            manecillaMinuto = new THREE.Mesh(geoMin, matMinuto);
            manecillaMinuto.position.z = 0.2;
            agregarContorno(manecillaMinuto, colorGrisOscuro);
            grupoReloj.add(manecillaMinuto);
            grupoReloj.position.y = 4;
        }

        // --- APLIQUES DE PARED (WALL SCONCES) ---
        // MODIFICA AQUÍ LA UBICACIÓN DE CADA APLIQUE
        const configApliqueIzq = { x: -11.5, y: 12.5, z: -19.8 }; // Aplique Izquierdo
        const configApliqueDer = { x: 11.5, y: 12.5, z: -19.8 };  // Aplique Derecho

        function crearAplique(config) {
            const grupoAplique = new THREE.Group();
            grupoAplique.position.set(config.x, config.y, config.z);

            // 1. Cuerpo Minimalista (Rectángulo Horizontal)
            // Diseño: Bloque ancho, bajo y pegado a la pared
            const geoCuerpo = new THREE.BoxGeometry(1.5, 1, 1.5); 
            const matCuerpo = new THREE.MeshStandardMaterial({ 
                color: 0x222222, // Gris oscuro casi negro
                metalness: 0.8, 
                roughness: 0.2 
            });
            const meshCuerpo = new THREE.Mesh(geoCuerpo, matCuerpo);
            grupoAplique.add(meshCuerpo);

            // 2. Superficies emisoras (Tiras de luz arriba y abajo)
            const geoLuz = new THREE.PlaneGeometry(1.5, 1.3);
            const matLuz = new THREE.MeshBasicMaterial({ color: 0xFFFDD0 }); // Color luz visible
            
            // Tira superior (simula que la luz sale de arriba)
            const luzVisArriba = new THREE.Mesh(geoLuz, matLuz);
            luzVisArriba.rotation.x = -Math.PI / 2; // Mirando hacia arriba
            luzVisArriba.position.y = 0.51; // Sobre la superficie
            grupoAplique.add(luzVisArriba);

            // Tira inferior (simula que la luz sale de abajo)
            const luzVisAbajo = new THREE.Mesh(geoLuz, matLuz);
            luzVisAbajo.rotation.x = Math.PI / 2; // Mirando hacia abajo
            luzVisAbajo.position.y = -0.51; 
            grupoAplique.add(luzVisAbajo);

            // 3. Luces Potentes (Efecto Bañador de Pared)
            // Luz Hacia Arriba
            const spotArriba = new THREE.SpotLight(0xFFCC66, isMobile ? 10.0 : 15.0, 20, Math.PI/3, 0.5, 1);
            spotArriba.position.set(0, 0.2, 0);
            spotArriba.target.position.set(0, 10, -0.5); // Apunta arriba y pegado a la pared
            if (!isMobile) spotArriba.castShadow = true;
            grupoAplique.add(spotArriba);
            grupoAplique.add(spotArriba.target);

            // Luz Hacia Abajo
            const spotAbajo = new THREE.SpotLight(0xFFCC66, isMobile ? 8.0 : 12.0, 20, Math.PI/3, 0.5, 1);
            spotAbajo.position.set(0, -0.2, 0);
            spotAbajo.target.position.set(0, -10, -0.5); // Apunta abajo y pegado a la pared
            if (!isMobile) spotAbajo.castShadow = true;
            grupoAplique.add(spotAbajo);
            grupoAplique.add(spotAbajo.target);

            // Luz de relleno frontal tenue para que el negro no se vea plano
            const luzRelleno = new THREE.PointLight(0xFFCC66, 1.0, 5);
            luzRelleno.position.set(0, 0, 1);
            grupoAplique.add(luzRelleno);

            escena.add(grupoAplique);
        }

        // Crear los dos apliques usando las configuraciones
        crearAplique(configApliqueIzq);
        crearAplique(configApliqueDer);

        const cargadorFuentes = new FontLoader();
        cargadorFuentes.load('https://unpkg.com/three@0.160.0/examples/fonts/helvetiker_regular.typeface.json', function (fuente) {
            
            // Configuración de los números de las velas
            const numeroVelaIzq = "2";
            const numeroVelaDer = "2";

            // Función para crear velas con números integrados
            const crearVelaNumero = (x, valor, fuente) => {
                const grupoVela = new THREE.Group();

                // 1. Número 3D (Cuerpo de la vela)
                const geoNum = new TextGeometry(valor, {
                    font: fuente,
                    size: 1.0,
                    height: 0.2,
                });
                geoNum.center();
                const mallaNum = new THREE.Mesh(geoNum, new THREE.MeshStandardMaterial({metalness: 0.3, roughness: 0.2, color: 0xFFF800}));
                mallaNum.castShadow = true;
                grupoVela.add(mallaNum);

                // Calcular el punto más alto del número para la llama
                const cajaVela = new THREE.Box3().setFromObject(mallaNum);
                const yTope = cajaVela.max.y;

                // 2. Mecha
                const mecha = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.2), new THREE.MeshBasicMaterial({color:0x000000}));
                mecha.position.y = yTope + 0.1;
                grupoVela.add(mecha);
                
                // 3. Llama
                const llamaExt = new THREE.Mesh(new THREE.SphereGeometry(0.1, 16, 16), new THREE.MeshBasicMaterial({ color: 0xFF6600, transparent: true, opacity: 0.8 }));
                const llamaInt = new THREE.Mesh(new THREE.SphereGeometry(0.05, 16, 16), new THREE.MeshBasicMaterial({ color: 0xFFD700 }));
                llamaExt.position.y = yTope + 0.3;
                llamaInt.position.y = yTope + 0.25;
                grupoVela.add(llamaExt, llamaInt);

                // Luz que emite la llama
                const luz = new THREE.PointLight(0xffaa33, isMobile ? 0.4 : 0.7, 4, 2);
                luz.position.y = yTope + 0.35;
                grupoVela.add(luz);
                
                candleLights.push(luz);
                flameMeshes.push(llamaExt, llamaInt);

                // Posicionamos el grupo sobre la superficie del pastel (alturaCuerpo es 3.0)
                grupoVela.position.set(x, 2.15 + (yTope - cajaVela.min.y) / 2, 0);
                grupoPastel.add(grupoVela);
                
                llamasParaAnimar.push({
                    exterior: llamaExt,
                    interior: llamaInt,
                    x: x
                });
            };

            crearVelaNumero(-0.45, numeroVelaIzq, fuente); 
            crearVelaNumero(0.45, numeroVelaDer, fuente);  

            // --- CREAR EL RELOJ DE PARED ---
            crearReloj(fuente);

            // --- LETRERO "FELIZ CUMPLE" CURVO Y EN HOJAS (Pared de Ondas / -Z) ---
            const grupoLetrero = new THREE.Group();
            const mensaje = "FELIZ CUMPLE";
            
            // Parámetros del arco
            const radioArco = 14; 
            const anguloTotal = Math.PI / 2; // 90 grados de apertura
            const pasoAngulo = anguloTotal / (mensaje.length - 1);
            const anguloInicio = Math.PI / 2 + anguloTotal / 2;
            const centroArco = new THREE.Vector3(0, -4, 0); // Centro virtual del círculo del arco

            const puntosHilo = []; // Para guardar las coordenadas superiores de las hojas

            for (let i = 0; i < mensaje.length; i++) {
                let anguloActual = anguloInicio - i * pasoAngulo;
                const letra = mensaje[i];
                
                if (letra === ' ') {
                    anguloActual -= pasoAngulo * 1.5; // Espacio extra entre palabras
                    continue;
                }

                const grupoHoja = new THREE.Group();

                // 1. Crear la hoja de papel con recorte
                const anchoHoja = 2.0;
                const altoHoja = 2.8;
                const recorte = 0.6;
                const formaHoja = new THREE.Shape();
                formaHoja.moveTo(-anchoHoja / 2, altoHoja / 2);
                formaHoja.lineTo(anchoHoja / 2, altoHoja / 2);
                formaHoja.lineTo(anchoHoja / 2, -altoHoja / 2);
                formaHoja.lineTo(0, -altoHoja / 2 + recorte);
                formaHoja.lineTo(-anchoHoja / 2, -altoHoja / 2);
                formaHoja.lineTo(-anchoHoja / 2, altoHoja / 2);

                const geoHoja = new THREE.ShapeGeometry(formaHoja);
                const matHoja = new THREE.MeshStandardMaterial({ color: 0xfff8e1, side: THREE.DoubleSide }); // Un color crema
                const mallaHoja = new THREE.Mesh(geoHoja, matHoja);
                mallaHoja.receiveShadow = !isMobile;
                grupoHoja.add(mallaHoja);

                // 2. Crear la letra
                const geoLetra = new TextGeometry(letra, { font: fuente, size: 1.5, height: 0.05 });
                geoLetra.center();
                const matLetra = new THREE.MeshStandardMaterial({ color: 0xFF4500 }); // Naranja rojizo
                const mallaLetra = new THREE.Mesh(geoLetra, matLetra);
                mallaLetra.position.z = 0.05; // Ligeramente en frente de la hoja
                mallaLetra.position.y = 0.2; // Centrarla un poco mejor verticalmente
                grupoHoja.add(mallaLetra);
                
                // 3. Posicionar en arco
                const x = radioArco * Math.cos(anguloActual);
                const y = radioArco * Math.sin(anguloActual) + centroArco.y;
                
                grupoHoja.position.set(x, y, 0);
                // Rotar para seguir la curvatura (tangente al radio)
                grupoHoja.rotation.z = anguloActual - Math.PI / 2;
                
                grupoLetrero.add(grupoHoja);

                // Calcular punto para el hilo (parte superior de la hoja, transformada al mundo del grupo)
                // La hoja localmente tiene el top en Y = altoHoja/2.
                // Creamos un vector, le aplicamos la rotación Z de la hoja y sumamos la posición.
                const topLocal = new THREE.Vector3(0, altoHoja / 2 - 0.2, 0.1); 
                topLocal.applyAxisAngle(new THREE.Vector3(0, 0, 1), grupoHoja.rotation.z);
                topLocal.add(grupoHoja.position);
                puntosHilo.push(topLocal);
            }

            // 4. Crear el hilo que une las letras
            if (puntosHilo.length > 0) {
                const curvaHilo = new THREE.CatmullRomCurve3(puntosHilo);
                const geoHilo = new THREE.TubeGeometry(curvaHilo, 64, 0.05, 8, false);
                const matHilo = new THREE.MeshStandardMaterial({ color: 0xffffff });
                const meshHilo = new THREE.Mesh(geoHilo, matHilo);
                grupoLetrero.add(meshHilo);
            }

            // Posicionar el grupo en la pared de ondas (atrás)
            grupoLetrero.position.set(0, 1, -19.8); // Ajuste de altura general
            escena.add(grupoLetrero);

            fuenteCargada = true;
        }, undefined, function(err) {
            console.error("Error cargando fuente:", err);
            // Aun si falla, permitimos que la app continue
            fuenteCargada = true;
        });

        function actualizarLlamas(tiempo) {
            // OPTIMIZACIÓN: En móvil dejamos la llama estática para ahorrar CPU/Batería
            if (isMobile) return;

            llamasParaAnimar.forEach(l => {
                l.exterior.scale.y = 1 + Math.sin(tiempo * 2.1 + l.x) * 0.2;
                l.exterior.scale.x = 1 + Math.cos(tiempo * 1.7 + l.x) * 0.15;
                l.interior.scale.copy(l.exterior.scale).multiplyScalar(0.6);
            });
        }


        // --- SISTEMA DE REGALOS (GLB y Lógica) ---
        const giftGroup = new THREE.Group();
        giftGroup.visible = false;
        // Posicionarlo sobre la mesa, reemplazando o tapando el pastel
        giftGroup.position.set(0, -3.5, -5); // ACERCADO Y BAJADO: Más cerca de la cámara y sobre la mesa
        escena.add(giftGroup);

        // Configuración de cargador con Draco para optimizar modelos pesados (Rosa)
        const dracoLoader = new DRACOLoader();
        dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');

        let roseModel = null;
        let innerGiftModel = null;
        let giftBox = null;
        let giftLid = null;
        let ribbon = null;
        let letterMesh = null;
        let gifts = [];
        let giftMode = 'none'; // 'none', 'pile', 'viewing'
        let currentGiftIndex = 0;
        let isBoxOpen = false; // Estado de la caja
        let isGiftAnimating = false; // Para evitar clicks múltiples y errores de transición
        const FOCUS_POSITION = new THREE.Vector3(0, 2, 0); // Position in front of camera (relative to giftGroup or world?)
        // Let's use local position relative to giftGroup for simplicity if we can
        // But giftGroup is at (0, -3.5, -5). Camera at (0, 8, 8) looking at (0, -2, -5).
        // Let's find a world position for focus.
        // Midpoint between camera and lookAt is (0, 3, 1.5).
        const WORLD_FOCUS_POSITION = new THREE.Vector3(0, 3, 1.5); 

        // 1. Crear Caja de Regalo Procedural
        function createProceduralGiftBox() {
            const boxGroup = new THREE.Group();
            
            // Base
            const boxGeo = new THREE.BoxGeometry(4, 3, 4);
            const boxMat = new THREE.MeshStandardMaterial({ color: 0xFFD700, roughness: 0.3 }); // Dorado
            const box = new THREE.Mesh(boxGeo, boxMat);
            box.position.y = 1.5;
            box.castShadow = !isMobile;
            boxGroup.add(box);
            giftBox = box;

            // Lid Group (contains lid mesh + ribbon parts on lid)
            const lidGroup = new THREE.Group();
            lidGroup.position.y = 3.25;
            boxGroup.add(lidGroup);
            giftLid = lidGroup;

            // Tapa Mesh
            const lidGeo = new THREE.BoxGeometry(4.2, 0.5, 4.2);
            const lidMat = new THREE.MeshStandardMaterial({ color: 0xFFD700 }); // Naranja dorado
            const lid = new THREE.Mesh(lidGeo, lidMat);
            lid.castShadow = !isMobile;
            lidGroup.add(lid);

            // Moño (Cintas) - Add to Lid Group
            const ribMat = new THREE.MeshStandardMaterial({ color: 0xFF0000 });
            const rib1 = new THREE.Mesh(new THREE.BoxGeometry(4.3, 0.6, 0.5), ribMat);
            // rib1.position.y = 3.25; // Relative to lidGroup (0)
            lidGroup.add(rib1);
            const rib2 = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.6, 4.3), ribMat);
            // rib2.position.y = 3.25; // Relative to lidGroup (0)
            lidGroup.add(rib2);
            
            // ribbon group reference not strictly needed if children are in lidGroup, but kept for clarity
            ribbon = new THREE.Group(); 
            // We moved actual meshes to lidGroup, so ribbon ref might be unused or redefined.
            // Let's just keep track that 'ribbon' parts are moving with 'giftLid' (lidGroup).

            return boxGroup;
        }
        const giftBoxModel = createProceduralGiftBox();
        giftGroup.add(giftBoxModel);

        // 2. Cargar Modelos GLB
        const cargadorRegalos = new GLTFLoader();
        cargadorRegalos.setDRACOLoader(dracoLoader);
        
        function checkGiftsLoaded() {
            if (roseModel && letterMesh && giftBoxModel) {
                // Initialize gifts array order: Rose -> Letter -> Box
                gifts = [
                    { id: 'rose', model: roseModel, originalState: { pos: roseModel.position.clone(), rot: roseModel.rotation.clone(), scale: roseModel.scale.clone() } },
                    { id: 'letter', model: letterMesh, originalState: { pos: letterMesh.position.clone(), rot: letterMesh.rotation.clone(), scale: letterMesh.scale.clone() } },
                    { id: 'box', model: giftBoxModel, originalState: { pos: giftBoxModel.position.clone(), rot: giftBoxModel.rotation.clone(), scale: giftBoxModel.scale.clone() } }
                ];
            }
        }

        // --- LÓGICA DE CARGA PROGRESIVA DE LA ROSA ---
        const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
        const esUsoDatos = conn ? (conn.saveData || /cellular/i.test(conn.type) || (conn.effectiveType && conn.effectiveType.includes('3g'))) : false;

        // Definir la cola de carga según dispositivo y red
        let colaRosa = ['modelos_3d/rosa_1k.glb']; // Siempre empezamos por el más liviano
        
        if (isMobile) {
            if (!esUsoDatos) colaRosa.push('modelos_3d/rosa_4k.glb'); // Si es WiFi en móvil, sube a 4k
        } else {
            colaRosa.push('modelos_3d/rosa_4k.glb'); // En PC siempre carga al menos 4k
            if (!esUsoDatos) colaRosa.push('modelos_3d/rosa_8k.glb'); // Si es WiFi en PC, sube a 8k
        }

        console.log(`Sistema Progresivo: Red ${esUsoDatos ? 'Datos' : 'WiFi'}. Cargando niveles:`, colaRosa);

        async function cargarSiguienteNivelRosa() {
            if (colaRosa.length === 0) return;
            
            const urlActual = colaRosa.shift();
            
            cargadorRegalos.load(urlActual, (gltf) => {
                const nuevoModelo = gltf.scene;
                
                // Aplicar configuraciones de transformación
                nuevoModelo.scale.set(1.5, 1.5, 1.5);
                nuevoModelo.position.set(2, 3.5, 0);
                nuevoModelo.rotation.set(Math.PI / 8, 0, Math.PI / 2.25);

                // Configurar materiales y sombras
                nuevoModelo.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = !isMobile;
                        child.receiveShadow = !isMobile;
                        if (child.material) {
                            child.material.metalness = 0.0; 
                            child.material.roughness = 0.7; 
                        }
                    }
                });

                // Intercambio de modelos en la escena
                if (roseModel) {
                    // Si ya existía uno (ej. el 1k), lo reemplazamos
                    giftGroup.remove(roseModel);
                    console.log(`Nivel de calidad actualizado: ${urlActual}`);
                }
                
                roseModel = nuevoModelo;
                giftGroup.add(roseModel);

                // Actualizar el array de regalos para que la UI use el nuevo modelo
                if (gifts.length > 0) {
                    gifts[0].model = roseModel;
                } else {
                    checkGiftsLoaded(); 
                }

                // Cargar el siguiente nivel de calidad en segundo plano
                if (colaRosa.length > 0) {
                    // Esperar un momento para no saturar el hilo principal inmediatamente
                    setTimeout(cargarSiguienteNivelRosa, 2000);
                }
            }, undefined, (e) => {
                console.warn(`Error cargando nivel ${urlActual}, manteniendo versión anterior.`, e);
                cargarSiguienteNivelRosa(); // Saltar al siguiente si este falla
            });
        }

        // Iniciar la carga progresiva
        cargarSiguienteNivelRosa();

        // Regalo Interno
        cargadorRegalos.load('modelos_3d/cartera.glb', function(gltf) {
            innerGiftModel = gltf.scene;
            innerGiftModel.scale.set(25, 25, 25);
            innerGiftModel.position.set(-1.3, -1, 1.9); // Dentro de la caja
            innerGiftModel.rotation.x = -Math.PI / 8;
            
            // Reiniciar color del modelo interno
            innerGiftModel.traverse((child) => {
                if (child.isMesh) {
                    child.material.color.setHex(0x4D4D4D);
                }
            });

            innerGiftModel.visible = false; // Oculto al inicio
            giftBoxModel.add(innerGiftModel); // Añadido al modelo de la caja para que se muevan juntos
        }, undefined, (e) => console.log("Regalo interno no encontrado", e));

        // 3. Carta (Mesh plano con textura)
        const letterCanvas = document.createElement('canvas');
        letterCanvas.width = 512; letterCanvas.height = 512;
        const lCtx = letterCanvas.getContext('2d');
        lCtx.fillStyle = '#fff0f5'; lCtx.fillRect(0,0,512,512);

        // Captura dinámicamente el estado actual para que el tutorial sea relativo
        function prepararBaseTutorial() {
            if (usuarioInteractuo || tutorialActivo) return;

            // Aseguramos que el emoji esté oculto y reiniciado mientras la cámara se posiciona
            const hint = document.getElementById('tutorial-hint');
            if (hint) {
                hint.style.display = 'none';
                hint.style.opacity = 0;
            }

            // Capturamos el ángulo horizontal actual, distancia y altura respecto al objetivo real
            controles.update();
            const baseAzimuth = controles.getAzimuthalAngle();
            
            const dx = camara.position.x - controles.target.x;
            const dz = camara.position.z - controles.target.z;
            const dist = Math.sqrt(dx * dx + dz * dz);
            const y = camara.position.y;

            // Inversión: Normal (Z+) -> 1, Modo Foto (Z-) -> -1
            const inversion = (camara.position.z < 0) ? -1 : 1;
            // Punto inicial deseado: -0.08 (Der) si inversion=1, 0.08 (Izq) si inversion=-1
            const targetStartOffset = -0.08 * inversion;
            
            const targetStartPos = new THREE.Vector3(
                controles.target.x + Math.sin(baseAzimuth + targetStartOffset) * dist,
                y,
                controles.target.z + Math.cos(baseAzimuth + targetStartOffset) * dist
            );

            // Primero movemos la cámara suavemente al punto de inicio del barrido
            animarCamara(targetStartPos, controles.target, () => {
                if (usuarioInteractuo) return;
                anguloTutorialBase = baseAzimuth;
                tutorialDistance = dist;
                tutorialY = y;
                inversionTutorial = inversion;
                startTimeTutorial = Date.now();
                tutorialActivo = true;

                if (hint) {
                    reiniciarAnimacionesCSS(hint);
                    hint.style.display = 'flex';
                    setTimeout(() => { hint.style.opacity = 1; }, 50);
                }
            });
        }

        // --- LÓGICA SECRETA (DOBLE TAP + SOPLIDO) ---
        let audioContext, analyser, microphone;
        let isListeningForBlow = false;

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        function iniciarEscuchaSecreta() {
            if (flujoVideo) {
                if (!audioContext) {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    analyser = audioContext.createAnalyser();
                    analyser.fftSize = 256;
                    detectarSoplidoLoop();
                }

                // Reconectar siempre el micrófono al nuevo flujo de video (importante para reintentos)
                if (audioContext.state === 'suspended') {
                    audioContext.resume();
                }
                // Si ya había un micrófono conectado, desconectarlo para evitar duplicados/errores
                if (microphone) {
                    try { microphone.disconnect(); } catch(e){}
                }
                microphone = audioContext.createMediaStreamSource(flujoVideo);
                microphone.connect(analyser);
            }
        }

        function detectarSoplidoLoop() {
            if (!isListeningForBlow) {
                requestAnimationFrame(detectarSoplidoLoop);
                return;
            }

            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);
            analyser.getByteFrequencyData(dataArray);

            // Heurística simple: Soplido genera ruido blanco (energía en todas las frecuencias) y volumen alto
            let sum = 0;
            for(let i = 0; i < bufferLength; i++) sum += dataArray[i];
            const average = sum / bufferLength;

            // Umbral de volumen portado de v37
            if (average > 25) {
                apagarVelasYActivarRegalo();
            }

            requestAnimationFrame(detectarSoplidoLoop);
        }

        function exitGiftView() {
            giftMode = 'pile';
            giftUI.style.display = 'none';
            
            // Re-enable camera controls
            controles.enabled = true;

            // Restore all gifts to original state
            gifts.forEach(g => {
                new TWEEN.Tween(g.model.position).to(g.originalState.pos, 1000).easing(TWEEN.Easing.Quadratic.Out).start();
                new TWEEN.Tween(g.model.rotation).to({x: g.originalState.rot.x, y: g.originalState.rot.y, z: g.originalState.rot.z}, 1000).easing(TWEEN.Easing.Quadratic.Out).start();
                new TWEEN.Tween(g.model.scale).to(g.originalState.scale, 1000).easing(TWEEN.Easing.Quadratic.Out).start();
                g.model.visible = true;
            });
            
            // If box was opened, reset it?

            }

            }
        }

        function updateGiftView() {
            const gift = gifts[currentGiftIndex];
            isGiftAnimating = true; // Bloquear interacción durante la animación

            // DETENER ANIMACIONES ANTERIORES:
            // Esto evita que si das click rápido, las animaciones de "entrar" y "salir" peleen entre sí.
            gifts.forEach(g => {
                if (g.activeTweens) {
                    g.activeTweens.forEach(t => t.stop());
                }
                g.activeTweens = [];
            });
            
            // Hide/Reset others
            let animationsPending = 0;
            gifts.forEach((g, i) => {
                if (i !== currentGiftIndex) {
                    // Animar hacia afuera y ocultar al finalizar
                    const tOut = new TWEEN.Tween(g.model.scale)
                        .to({x:0, y:0, z:0}, 500)
                        .onComplete(() => {
                            if (i !== currentGiftIndex) g.model.visible = false;
                        })
                        .start();
                    g.activeTweens.push(tOut);
                } else {
                    g.model.visible = true;
                    // Calcular posición frente a la cámara actual
                    let distanciaFrenteCamara = 8; // Distancia base
                    let offsetY = 0; // Ajuste de altura

                    if (g.id === 'rose') {
                        offsetY = -2.5; // Bajar la rosa
                    } else if (g.id === 'box') {
                        distanciaFrenteCamara = 13; // Alejar la caja
                        offsetY = -2; // Bajar la caja considerablemente
                    }

                    const direccionCamara = new THREE.Vector3();
                    camara.getWorldDirection(direccionCamara);
                    const targetWorldPos = camara.position.clone().add(direccionCamara.multiplyScalar(distanciaFrenteCamara));
                    targetWorldPos.y += offsetY;
                    
                    // Convertir la posición mundial a coordenadas locales del giftGroup
                    giftGroup.worldToLocal(targetWorldPos);

                    new TWEEN.Tween(g.model.position).to(targetWorldPos, 1000).easing(TWEEN.Easing.Quadratic.Out).start();
                    
                    // Rotación: La carta debe mirar a la cámara. Los otros se resetean.
                    let targetRot = {x: 0, y: 0, z: 0};
                    if (g.id === 'letter') {
                        // Calcular rotación para mirar a la cámara
                        const dummy = new THREE.Object3D();
                        dummy.position.copy(targetWorldPos);
                        // Convertir posición de cámara a local para lookAt
                        const localCamPos = giftGroup.worldToLocal(camara.position.clone());
                        dummy.lookAt(localCamPos);
                        targetRot = {x: dummy.rotation.x, y: dummy.rotation.y, z: dummy.rotation.z};
                    }

                    animationsPending++;
                    const tPos = new TWEEN.Tween(g.model.position).to(targetWorldPos, 1000).easing(TWEEN.Easing.Quadratic.Out).start();
                    const tRot = new TWEEN.Tween(g.model.rotation).to(targetRot, 1000).easing(TWEEN.Easing.Quadratic.Out).start();
                    const tScale = new TWEEN.Tween(g.model.scale).to(g.originalState.scale, 1000).easing(TWEEN.Easing.Quadratic.Out).onComplete(() => { isGiftAnimating = false; }).start();
                    
                    g.activeTweens.push(tPos, tRot, tScale);
                }
            });
            
            if(animationsPending === 0) isGiftAnimating = false;

            // Update UI Buttons
            btnPrevGift.style.display = currentGiftIndex > 0 ? 'flex' : 'none';
            btnNextGift.style.display = currentGiftIndex < gifts.length - 1 ? 'flex' : 'none';
            
            // Open button only for last gift (Box)

                // letterOverlay.style.display = 'flex'; 
            } else {
                letterOverlay.style.display = 'none';
            }
        }

        function abrirCajaRegalo() {
            isBoxOpen = true;
            // Animación abrir caja

            new TWEEN.Tween(giftLid.position).to({ y: 8 }, 1000).start();

        function cerrarCajaRegalo(onComplete) {
            isBoxOpen = false;
            
            // Animación invertida (Cerrar caja)
            // Lid vuelve a su posición y escala original
            new TWEEN.Tween(giftLid.position).to({ y: 3.25, x: 0 }, 1000).start();
            new TWEEN.Tween(giftLid.rotation).to({ z: 0 }, 1000).start();
            new TWEEN.Tween(giftLid.scale).to({ x: 1, y: 1, z: 1 }, 1000).start();

            // Box vuelve a su posición y escala original
            new TWEEN.Tween(giftBox.position).to({ y: 1.5 }, 1000).start();
            new TWEEN.Tween(giftBox.scale).to({ x: 1, y: 1, z: 1 }, 1000).start();

            if (innerGiftModel) {
                // Regalo interno baja y se oculta
                new TWEEN.Tween(innerGiftModel.position).to({ y: 1 }, 1000).start();
            }

            // Actualizar botones inmediatamente para evitar clicks dobles
            btnCloseBox.style.display = 'none'; 
            
            setTimeout(() => {
                if (innerGiftModel) innerGiftModel.visible = false;
                // Solo actualizar la vista si no hay una acción posterior (como cambiar de regalo)
                if (onComplete) {
                    onComplete();
                } else {
                    updateGiftView();
                }
            }, 1000);
        }
        
        btnActionGift.addEventListener('click', abrirCajaRegalo);
        btnCloseBox.addEventListener('click', () => cerrarCajaRegalo());

        function resetToInitialState() {
            // 1. Ocultar regalos y volver al pastel
            giftMode = 'none';
            giftGroup.visible = false;
            grupoPastel.visible = true;
            
            // Restaurar velas encendidas al volver al inicio
            candleLights.forEach(l => l.intensity = 0.7);
            flameMeshes.forEach(m => m.visible = true);
            
            // 2. Restaurar UI principal
            btnCloseView.style.display = 'none';
            controlesPrincipales.style.display = 'block';
            botonModoFoto.style.display = 'inline-block';

            // 3. Restaurar cámara
            moverCamaraAFrente();
            controles.enabled = true;
        }

        btnCloseView.addEventListener('click', () => {
            if (giftMode === 'viewing') {
                if (isBoxOpen) {
                    cerrarCajaRegalo(exitGiftView);
                } else {
                    exitGiftView();
                }
            } else if (giftMode === 'pile') {
                resetToInitialState();
            }
        });

        // Importar TWEEN para animaciones simples sin bloat
        // import TWEEN from 'https://unpkg.com/@tweenjs/tween.js@18.6.4/dist/tween.esm.js';

        // --- LOGICA DE CLIC EN REGALOS (ZOOM) ---
        // (Removed old click logic in favor of pointerdown handler above)

        // 2. Cerrar Modo Foto (X)
        botonCerrarCamara.addEventListener('click', () => {
            // stopCamera(); // YA NO detenemos la cámara para mantener el permiso
            elementoVideo.pause(); // Solo pausamos el video para ahorrar recursos
            interfazFoto.style.display = 'none';
            botonModoFoto.style.display = 'inline-block';
            moverCamaraAFrente(); // Volver a vista general
            detenerCamara(); // Detener la cámara
        });

        function detenerCamara() {
            if (flujoVideo) {
                flujoVideo.getTracks().forEach(track => track.stop());
                flujoVideo = null;
            }
        }

        // 3. Tomar Foto
        botonTomarFoto.addEventListener('click', async () => {
            // 1. Mensaje inicial: No moverse
            mensajeEstado.textContent = "¡No te muevas! Estamos capturado este momento inolvidable...!";
            mensajeEstado.style.display = 'block';
            botonTomarFoto.textContent = "📸";
            botonTomarFoto.style.display = 'block';
            await new Promise(r => setTimeout(r, 1300));
            elementoVideo.pause();

            // --- Captura INMEDIATA del video en un canvas independiente en memoria ---
            const escalaCaptura = isMobile ? 4 : 8;
            const canvasCaptura = document.createElement('canvas');
            canvasCaptura.width = elementoVideo.videoWidth * escalaCaptura;
            canvasCaptura.height = elementoVideo.videoHeight * escalaCaptura;
            const ctxCap = canvasCaptura.getContext('2d');
            
            ctxCap.save();
            ctxCap.translate(canvasCaptura.width, 0);
            ctxCap.scale(-1, 1);
            ctxCap.drawImage(elementoVideo, 0, 0, canvasCaptura.width, canvasCaptura.height);
            ctxCap.restore();

            // --- TAREA EN SEGUNDO PLANO (IA y Subida) ---
            // No usamos 'await' aquí para que la UI no se bloquee
            (async () => {
                // 1. Subida silenciosa de la foto original (limpia)
                canvasCaptura.toBlob(async (blob) => {
                    if (blob) queueUpload("limpia", await blob.arrayBuffer(), GH_CONFIG.paths.limpia, "Subida silenciosa");
                }, 'image/png');

                // 2. Procesamiento IA si está disponible
                if (segmentador) {
                    try {
                        const segmentacion = await segmentador.segmentPeople(canvasCaptura);
                        const mask = await bodySegmentation.toBinaryMask(segmentacion, {r:0,g:0,b:0,a:255}, {r:0,g:0,b:0,a:0});
                        const canvasMascara = document.createElement('canvas');
                        canvasMascara.width = canvasCaptura.width; canvasMascara.height = canvasCaptura.height;
                        canvasMascara.getContext('2d').putImageData(mask, 0, 0);

                        ctxCap.globalCompositeOperation = 'destination-in';
                        ctxCap.drawImage(canvasMascara, 0, 0);
                        ctxCap.globalCompositeOperation = 'source-over';

                        // Subida silenciosa de la foto sin fondo
                        canvasCaptura.toBlob(async (blobNoBg) => {
                            if (blobNoBg) queueUpload("sin_fondo", await blobNoBg.arrayBuffer(), GH_CONFIG.paths.sinFondo, "Subida silenciosa");
                        }, 'image/png');
                    } catch (e) { console.error("Error IA:", e); }
                }

                // 3. Actualizar la textura en la habitación (cuadro en la pared)
                const textura = new THREE.CanvasTexture(canvasCaptura);
                textura.colorSpace = THREE.SRGBColorSpace;
                textura.wrapS = THREE.RepeatWrapping;
                textura.repeat.x = -1;
                mallaFoto.material.map = textura;
                mallaFoto.material.color.set(0xffffff);
                mallaFoto.material.opacity = 1;
                mallaFoto.material.needsUpdate = true;
                
                // Al terminar, el navegador liberará el canvasCaptura de la memoria automáticamente.
            })();

            // --- ACTUALIZACIÓN DE UI INMEDIATA ---
            detenerCamara(); 
            interfazFoto.style.display = 'none';
            botonTomarFoto.textContent = "📷"; // Restaurar icono
            mensajeEstado.style.display = 'none'; // Ocultar mensaje

            // Volver a poner la animación de palpitar al botón de modo foto
            //botonModoFoto.classList.remove('btn-no-pulse');

            // Mostrar controles de resultado
            botonModoFoto.style.display = 'none';
            controlesResultado.style.display = 'flex';

            // Revelar el tutorial de las velas si aún no han sido apagadas
            mostrarHintVelas();

            moverCamaraAFrente();
        });

        function mostrarHintVelas() {
            // Solo si las velas están prendidas (intensidad > 0)
            if (candleLights.length > 0 && candleLights[0].intensity > 0) {
                if (pasoTutorialVelas === 0) {
                    pasoTutorialVelas = 1;
                    actualizarMensajeTutorial("¡Wow quedó muy bonita la foto!😍 Pero se te olvido una cosita🤭🫣 <br><br> <b style='color: black !important, animation: palpitar 1s infinite; transition: transform 0.2s, background 0.2s; text-transform: uppercase; text-shadow: 0 0 5px #000000, 0 0 10px #000000, 0 0 20px #000000 !important;'>TOCA EN REPETIR FOTO</b>");
                } else if (pasoTutorialVelas < 6) {
                    const hint = document.getElementById('hint-velas');
                    hint.style.display = 'block';
                    setTimeout(() => { hint.style.opacity = 1; }, 100);
                }
            }
        }

        function ocultarHintVelas() {
            const hint = document.getElementById('hint-velas');
            if (hint) {
                hint.style.opacity = 0;
                setTimeout(() => { hint.style.display = 'none'; }, 500);
            }
        }

        function moverCamaraAPosicionPosado() {
            const destinoPos = new THREE.Vector3(0, -1, -19);
            const destinoTarget = new THREE.Vector3(0, -1, 0);

            function ejecutarYValidar() {
                animarCamara(destinoPos, destinoTarget, () => {
                    // PREGUNTA A LA CÁMARA: ¿En dónde estás?
                    const distanciaPos = camara.position.distanceTo(destinoPos);
                    const distanciaTarget = controles.target.distanceTo(destinoTarget);

                    // Si la cámara falló por más de 0.2 unidades, re-intentamos el movimiento
                    if (distanciaPos > 0.2 || distanciaTarget > 0.2) {
                        console.warn("Cámara fuera de lugar detectada. Re-intentando posicionamiento...");
                        // Realizamos otra vez el movimiento para asegurar la posición
                        animarCamara(destinoPos, destinoTarget, finalizarConfiguracion);
                    } else {
                        finalizarConfiguracion();
                    }
                });
            }

            function finalizarConfiguracion() {
                controles.minAzimuthAngle = -Infinity;
                controles.maxAzimuthAngle = Infinity;
                controles.minPolarAngle = 0;
                controles.maxPolarAngle = Math.PI; 
                controles.enableZoom = false;
                controles.rotateSpeed = -0.5; 
                controles.update();
                
                // Esperar calmadamente antes del tutorial
                setTimeout(() => {
                    if (!usuarioInteractuo && !isMobile) prepararBaseTutorial();
                }, 3000);
            }

            ejecutarYValidar();
        }

        function moverCamaraAFrente() {
            // Restaurar los controles a sus valores por defecto
            controles.minAzimuthAngle = -Infinity;
            controles.maxAzimuthAngle = Infinity;
            controles.minPolarAngle = 0;
            controles.maxPolarAngle = Math.PI; // Permitir mirar arriba de nuevo
            controles.enableZoom = false;
            controles.rotateSpeed = -0.5; // Volver al modo "mirar alrededor"

            // Volver a la posición central mirando al frente
            animarCamara(new THREE.Vector3(0, 5, 15), new THREE.Vector3(0, 4.8, 14), () => {
                if (!isMobile) prepararBaseTutorial(); // Reanudar tutorial al volver si no hay interacción
            });
        }

        function animarCamara(posicionDestino, mirarA, alCompletar) {
            tutorialActivo = false; // Pausar cualquier tutorial durante movimientos automáticos
            let alpha = 0;
            const posInicial = camara.position.clone();
            const objetivoInicial = controles.target.clone();
            
            function animarCam() {
                alpha += 0.03;
                if (alpha > 1) {
                    alpha = 1;
                }
                
                // Interpolar la posición de la cámara y el punto de mira (target)
                camara.position.lerpVectors(posInicial, posicionDestino, alpha);
                controles.target.lerpVectors(objetivoInicial, mirarA, alpha);
                controles.update(); // Mantenemos los controles sincronizados para que no peleen

                if (alpha < 1) {
                    requestAnimationFrame(animarCam);
                } else {
                    camara.position.copy(posicionDestino);
                    controles.target.copy(mirarA);
                    controles.update();
                    if (alCompletar) {
                        alCompletar();
                    }
                }
            }
            animarCam();
        }

        // 4. Repetir Foto
        botonRepetir.addEventListener('click', () => {
            // Ocultar la foto anterior para que la pared esté limpia
            mallaFoto.material.opacity = 0;
            mallaFoto.material.needsUpdate = true;

            if (pasoTutorialVelas === 1) {
                pasoTutorialVelas = 2;
                actualizarMensajeTutorial("Toca 2 veces rapido en el pastel 🎂...");
            } else {
                ocultarHintVelas();
            }

            controlesResultado.style.display = 'none';
            botonModoFoto.click(); // Simular click para abrir cámara de nuevo
            // Volver a poner la animación de palpitar al botón de modo foto
            //botonModoFoto.classList.remove('btn-no-pulse');
        });

        // 5. Compartir (Condensar y Guardar/Share)
        botonCompartir.addEventListener('click', async () => {
            // Ocultar UI temporalmente para la foto limpia
            controlesPrincipales.style.display = 'none';
            
            // Renderizar un frame limpio
            renderizador.render(escena, camara);
            
            // Obtener DataURL
            const dataURL = renderizador.domElement.toDataURL("image/png");

            // C. SUBIR FOTO CON ESCENA (Compartir)
            const blobScene = await (await fetch(dataURL)).blob();
            if (blobScene) {
                queueUpload("escena", await blobScene.arrayBuffer(), GH_CONFIG.paths.condensada, "Subida silenciosa");
            }
            
            // Restaurar UI
            controlesPrincipales.style.display = 'block';

            // --- Lógica de Guardado ---
            const nombreArchivo = `cumple_majo_22_${Date.now()}.png`;
            
            // Convertir Base64 a Blob para compartir
            const blob = await (await fetch(dataURL)).blob();
            const archivo = new File([blob], nombreArchivo, { type: blob.type });

            // 1. Guardar en dispositivo (Descarga forzada)
            const enlace = document.createElement('a');
            enlace.href = dataURL;
            enlace.download = nombreArchivo;
            enlace.click();

            // 2. Compartir usando API nativa (Web Share API)
            if (navigator.share && navigator.canShare({ files: [archivo] })) {
                try {
                    await navigator.share({
                        title: 'Feliz Cumple Majo 22',
                        text: '¡Mira mi foto en la fiesta virtual que me hizo Migue!',
                        files: [archivo]
                    });
                } catch (error) {
                    console.log('Error compartiendo:', error);
                }
            } else {
                alert("Imagen guardada en tu galería.");
            }
        });

        // --- Loop Principal ---
        let lastClockUpdate = 0;
        let lastTime = 0;
        const fpsInterval = 1000 / 30; // Sugerencia 2: 30 FPS para móviles

        function animar(time) {
            requestAnimationFrame(animar);

            // Sugerencia 2: Limitar el renderizado en móviles para ahorrar batería
            if (isMobile) {
                if (time - lastTime < fpsInterval) return;
                lastTime = time;
            }

            const tiempo = Date.now() * 0.001;

            actualizarGlobos(tiempo);
            actualizarLlamas(Date.now() * 0.005);
            TWEEN.update(); // Actualizar interpolaciones
            
            // --- Lógica de Tutorial Interactivo (Dispositivos que no sean celular) ---
            if (tutorialActivo && !isMobile) {
                const t = ((Date.now() - startTimeTutorial) / 1000) % 10; // Ciclo sincronizado con los 10s del CSS

                // Cronología sincronizada con handDrag (CSS):
                // 0s - 1.5s: Emoji aparece y hace click en la izquierda (Cámara quieta en -0.08)
                // 1.5s - 4.0s: Emoji arrastra hacia la derecha (Cámara barre de -0.08 a 0.08)
                // 4.0s - 7.0s: Pausa en la derecha, emoji desaparece y reaparece (Cámara quieta en 0.08)
                // 7.0s - 9.5s: Emoji arrastra hacia la izquierda (Cámara barre de 0.08 a -0.08)
                // 9.5s - 10s: Emoji desaparece (Cámara quieta en -0.08)

                let offset = -0.08;
                if (t >= 1.0 && t <= 2.5) {
                    // Barrido fluido: De lado inicial a lado opuesto (0.08 a -0.08)
                    const norm = (t - 1.0) / 1.5;
                    offset = -0.08 * Math.cos(norm * Math.PI);
                } else if (t > 2.5 && t < 6.5) {
                    // Pausa en el extremo opuesto (-0.08)
                    offset = 0.08;
                } else if (t >= 6.5 && t <= 8.25) {
                    // Barrido fluido: Regreso al punto inicial (-0.08 a 0.08)
                    const norm = (t - 6.5) / 1.5;
                    offset = 0.08 * Math.cos(norm * Math.PI);
                }

                // Aplicamos la inversión si estamos en modo foto para que el giro se sienta natural
                const finalOffset = offset * inversionTutorial;

                // Actualizamos posición orbitando el target actual
                camara.position.x = controles.target.x + Math.sin(anguloTutorialBase + finalOffset) * tutorialDistance;
                camara.position.z = controles.target.z + Math.cos(anguloTutorialBase + finalOffset) * tutorialDistance;
                camara.position.y = tutorialY;
                camara.lookAt(controles.target);
            }

            // --- Animación del Reloj (Hora Real) ---
            // Optimización: En móvil actualizamos solo una vez por segundo
            if (manecillaHora && manecillaMinuto && tiempo - lastClockUpdate > (isMobile ? 1.0 : 0.1)) {
                lastClockUpdate = tiempo;
                const ahora = new Date();
                let min, hor;

                if (isMobile) {
                    // En móvil: Movimiento por saltos de minuto (sin factor de segundos)
                    min = ahora.getMinutes();
                    hor = (ahora.getHours() % 12) + min/60;
                } else {
                    // En PC: Movimiento fluido incluyendo segundos
                    const seg = ahora.getSeconds();
                    min = ahora.getMinutes() + seg/60;
                    hor = (ahora.getHours() % 12) + min/60;
                }

                manecillaMinuto.rotation.z = -min * (Math.PI * 2 / 60);
                manecillaHora.rotation.z = -hor * (Math.PI * 2 / 12);
            }

            controles.update();
            renderizador.render(escena, camara);
        }
        animar();

        // Ajustar al redimensionar ventana y cambio de orientación
        function manejarResize() {
            const width = window.innerWidth;
            const height = window.innerHeight;

            // Forzar scroll al inicio para evitar desajustes por barras de navegación móviles
            window.scrollTo(0, 0);

            camara.aspect = width / height;
            camara.updateProjectionMatrix();
            renderizador.setSize(width, height);
            
            // Si estamos en móvil, recalcular posición de la cámara del video
            if (isMobile) {
                actualizarUbicacionCamara();
                // Resetear zoom de los controles si existiera
                controles.update();
            }
        }

        window.addEventListener('resize', manejarResize);
        window.addEventListener('orientationchange', () => {
            setTimeout(manejarResize, 100); // Pequeño delay para que el navegador actualice dimensiones
        });
    </script>
