<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="icon" href="img/caja_de_regalo.png">
    <title>Feliz Cumple #22 Majo</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #333; font-family: 'Arial', sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; display: block; }
        :root { --nav-display: flex; }
        
        /* UI Overlay General */
        .ui-layer {
            position: absolute;
            pointer-events: none; /* Permite clickear el 3D a través */
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
        }
        
        /* Ajustes para móviles */
        body.is-mobile .btn:not(.gift-nav-btn):not(.cerrar-camara):not(.btn-icon) {
                padding: 15px 30px;
                font-size: 20px;
                width: 80%;
                max-width: 300px;
                border: solid 3px black;
            }
            /* Botón modo foto más grande en móvil */
            body.is-mobile #boton-modo-foto {
                padding: 20px 40px !important;
                font-size: 24px !important;
                width: 90% !important;
                left: 55% !important;
                /* Animación de palpitar */
                animation: palpitar 1s infinite;
            }


                /* Keyframes de la animación */
                @keyframes palpitar {
                0%, 100% {
                    transform: scale(1);
                }
                50% {
                    transform: scale(1.1); /* Aumenta tamaño al 110% */
                }
                }
            /* Botón de captura más grande, cómodo y perfectamente circular */
            body.is-mobile .btn-icon {
                width: 95px; 
                height: 95px; 
                font-size: 40px !important;
                padding: 0 !important;
                display: flex !important;
                align-items: center !important;
                justify-content: center !important;
                border-radius: 50% !important;
                line-height: 1 !important;
            }
            #controles-resultado {
                display: none; /* Se muestra después de tomar la foto */
                pointer-events: auto;
                gap: 15px;
                justify-content: center;
                left: 50%;
                transform: translateX(-0.5%);
                width: 90%;
            }
        #boton-modo-foto{
            left: 50%;
            transform: translateX(-6.45%);
        }
        
        /* Mensaje de estado para la foto */
        #mensaje-estado {
            display: none;
            position: absolute;
            top: 20%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.5);
            color: white;
            padding: 15px 25px;
            border-radius: 30px;
            font-size: 1.2rem;
            z-index: 100;
            text-align: center;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        /* Botones interactivos */
        .btn {
            pointer-events: auto;
            background: rgba(255, 105, 180, 0.9);
            color: white !important;
            border: solid 3px black;
            padding: 12px 24px;
            font-size: 18px;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: transform 0.2s, background 0.2s;
            text-transform: uppercase;
            font-weight: bold;
            /* Animación de palpitar */
            animation: palpitar 1s infinite;
        }

        /* Keyframes de la animación */
        @keyframes palpitar {
            0%, 100% {
                transform: translateX(-6.45%) scale(1);
            }
            50% {
                transform: translateX(-6.45%) scale(1.1);
            }
        }

        .btn:active { transform: scale(0.95); }
        .btn-icon { font-size: 24px; padding: 0 0 5px 0; border-radius: 50%; width: 60px; height: 60px; display: flex; align-items: center; justify-content: center;}

        /* Clase para quitar palpitación */
        .btn-no-pulse {
            animation: none !important;
        }

        /* Estilo Neon para el botón principal */
        .btn-neon {
            background-color: rgba(0, 0, 0, 0.7) !important;
            border: 2px solid #fff !important;
            box-shadow: 0 0 10px #fff, 0 0 20px #ff00de, 0 0 40px #ff00de !important;
            text-shadow: 0 0 5px #fff, 0 0 10px #fff, 0 0 20px #ff00de !important;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        /* Botones de navegación de regalos (Laterales) */
        .gift-nav-btn {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            padding: 0 0 5px 0 !important;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px !important;
            border: 2px solid white !important;
            display: none; /* Dejar que JS controle la visibilidad */
        }
        /* Ajuste de navegación para móviles (Círculos perfectos) */
        body.is-mobile .gift-nav-btn {
            width: 70px !important;
            height: 70px !important;
            padding: 0 !important;
            border-radius: 50% !important;
            display: flex; /* Quitamos !important para permitir que JS los oculte */
            align-items: center !important;
            justify-content: center !important;
        }
        body.is-mobile #btn-prev-gift { left: 10px !important; transform: translateY(-50%) !important; }
        body.is-mobile #btn-next-gift { right: 10px !important; transform: translateY(-50%) !important; left: auto !important; }
        
        #btn-prev-gift { left: 50px; background: rgba(0, 91, 227, 0.8) !important; animation: none !important; transform: translateY(-50%); }
        #btn-next-gift { right: 50px; left: auto; background: rgba(26, 171, 0, 0.8) !important; animation: none !important; transform: translateY(-50%); }


        /* Botones de acción de regalos (Inferior Centro) */
        .gift-action-btn {
            position: fixed;
            bottom: 40px;
            left: 40%;
            z-index: 1000;
            padding: 15px 40px !important;
            font-size: 22px !important;
            width: auto !important;
            background: rgba(222, 131, 255, 0.9) !important;
            border: 2px solid white !important;
        }
        body.is-mobile .gift-action-btn { left: 50% !important; transform: translateX(-50%) !important; width: 65% !important; min-width: 260px; }

        /* Modo Foto UI */
        #interfaz-foto {
            left: 20px;
            display: none;
            position: absolute;
            top: 25px;
            width: 250px; /* Tamaño PC */
            height: 180px;
            background: #000;
            border: 4px solid white;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            z-index: 10;
            pointer-events: auto;
        }

        /* Clases dinámicas para mover la cámara según inclinación en móvil */
        body.is-mobile #interfaz-foto {
            width: 57vw; /* Ampliado para mejor visibilidad */
            height: 23vh; 
            left: 50%;
            top: 35px;
            transform: translateX(-50%);
        }

        body.is-mobile #interfaz-foto.camara-derecha {
            left: auto !important;
            right: 10px !important; /* Margen de 10px */
            width: 35vw; /* Ampliado */
            height: 55vh; 
            top: 50%;
            transform: translateY(-50%) !important;
        }

        body.is-mobile #interfaz-foto.camara-izquierda {
            left: 10px !important; /* Margen de 10px */
            right: auto !important;
            width: 35vw; /* Ampliado */
            height: 55vh; 
            top: 50%;
            transform: translateY(-50%) !important;
        }

        #transmision-camara {
            width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); border-radius: 6px;
        }
        .camera-controls {
            position: absolute; 
            bottom: 0; /* Pegado al borde inferior */
            left: 50%;
            transform: translate(-50%, 50%); /* Centrado horizontal y verticalmente sobre el borde */
            width: auto;
            display: flex; 
            justify-content: center;
            z-index: 30;
        }
        .cerrar-camara {
            position: absolute;
            background: rgba(255, 0, 0, 0.8); color: white; width: 50px; height: 50px; 
            border-radius: 50%; font-size: 24px; border: 2px solid white; 
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            z-index: 20;
            padding: 0 !important;
            /* Posición por defecto (Portrait) - Esquina superior derecha centrada en bordes */
            top: 0;
            right: 0;
            transform: translate(50%, -50%);
        }

        /* Ajustes específicos para las orientaciones horizontales en móvil */
        body.is-mobile #interfaz-foto.camara-derecha .cerrar-camara {
            top: 0% !important;
            left: 0 !important;
            right: auto !important;
            /* Centrado en el borde izquierdo verticalmente */
            transform: translate(-50%, -50%) !important;
        }

        body.is-mobile #interfaz-foto.camara-izquierda .cerrar-camara {
            top: 0% !important;
            right: 0 !important;
            left: auto !important;
            /* Centrado en el borde derecho verticalmente */
            transform: translate(50%, -50%) !important; 
        }

        body.is-mobile .cerrar-camara {
            width: 70px !important;
            height: 70px !important;
            font-size: 35px !important;
        }
        #btn-close-view {
            background: rgba(255, 0, 0, 0.8) !important;
            color: white !important;
            border: 2px solid white !important;
            right: 10px !important;
            top: 10px !important;
            left: auto !important; /* Forzar esquina derecha */
            transform: none !important;
            margin: 0 !important;
        }

        /* Botones de acción principales */
        #controles-principales {
            position: absolute; 
            bottom: 30px; 
            width: 100%; 
            text-align: center;
            pointer-events: none;
        }
        
        #controles-resultado {
            display: none; /* Se muestra después de tomar la foto */
            pointer-events: auto;
            gap: 50px;
            justify-content: center;
            left: 50%;
            right: 50%;
            width: 100%;
        }

        #boton-repetir {
            animation: none !important;
        }

        #boton-compartir{
            background-color: rgba(0, 0, 0, 0.7) !important;
            border: 2px solid #fff !important;
            box-shadow: 0 0 10px #fff, 0 0 20px #ff00de, 0 0 40px #ff00de !important;
            text-shadow: 0 0 5px #fff, 0 0 10px #fff, 0 0 20px #ff00de !important;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        /* Loading Overlay */
        /* Animación de Carga "Abrir Ojos" */
        #loading-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 9999;
            display: flex; flex-direction: column;
            pointer-events: none; /* Permitir clicks tras ocultarse */
        }
        
        .eyelid {
            width: 100%;
            height: 50%;
            background-color: #000;
            transition: transform 1.8s cubic-bezier(0.645, 0.045, 0.355, 1); /* Animación suave y lenta */
            z-index: 2;
        }
        
        #eyelid-top { transform-origin: top; }
        #eyelid-bottom { transform-origin: bottom; }

        /* Tutorial Interactivo */
        #tutorial-hint {
            position: fixed;
            top: 55%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 8000;
            pointer-events: none;
            display: none;
            flex-direction: column;
            align-items: center;
            opacity: 0;
            transition: opacity 0.8s ease;
        }

        /* Mensaje de Tutorial post-foto */
        #hint-velas {
            position: fixed;
            z-index: 8500;
            pointer-events: none;
            display: none;
            opacity: 0;
            transition: opacity 0.5s ease;
            width: 300px;
        }
        .hint-velas-content {
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 15px;
            border-radius: 20px;
            border: 2px solid white;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            font-weight: bold;
            line-height: 1.4;
        }
        @media (orientation: landscape) {
            #hint-velas { left: 20px; top: 50%; transform: translateY(-50%); }
        }
        @media (orientation: portrait) {
            #hint-velas { top: 10px; left: 50%; transform: translateX(-50%); }
        }

        .tutorial-text {
            color: white;
            font-size: 1.2rem;
            margin-top: 0px;
            text-shadow: 2px 2px 4px rgba(190, 245, 255, 0.8);
            background: rgba(0,0,0,0.77);
            padding: 20px;
            border-radius: 20px;
        }

        /* ========================= MANO PRINCIPAL ========================= */
        .hand-animation {
            font-size: 60px;
            filter: drop-shadow(0 0 10px rgba(0,0,0,0.5));
            animation: handDrag 10s infinite cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            z-index: 50;
        }

        /* ========================= GHOST TRAIL (NUEVO) ========================= */
        .hand-animation::before {
            content: "👆🏼";
            position: absolute;
            top: 0;
            left: 0;
            font-size: 60px;
            opacity: 0;
            /* Explicacion de parametros blur = Desenfoque, brightness = Brillo, saturate = Saturacion*/
            /* Entre mayor sea el valor de blur mas desenfocado se ve*/
            /* Entre mayor sea el valor de brightness mas brillante se ve osea mas saturado hacia blanco*/
            /* Entre mayor sea el valor de saturate más intenso es el color pudiendo descolorarse*/
            filter: blur(0) brightness(1.3) saturate(1.5);
            
            /* glow suave */
            text-shadow: 0 0 8px rgba(144, 144, 144, 0.6);
            transform: translate(0,0);
            animation: ghostTrail 10s infinite;
            pointer-events: none;
            z-index: 40;
        }

        /* ========================= ONDA PRINCIPAL ========================= */
        .hand-animation::after {
            content: '';
            position: absolute;
            top: 20%;
            left: 40%;
            width: 23px;
            height: 23px;
            border-radius: 50%;
            background: radial-gradient(circle,
                rgba(0,225,255,0.9),
                rgba(0,225,255,0.3),
                transparent
            );
            transform: translate(-50%, -50%) scale(0);
            opacity: 0;
            pointer-events: none;
            animation: rippleSync 10s infinite;
            z-index: 0;
            filter: blur(2px);
        }

        /* ONDA SECUNDARIA */
        .hand-animation span {
            position: absolute;
            top: 20%;
            left: 40%;
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background: radial-gradient(circle,
                rgba(0,47,255,0.8),
                transparent
            );
            transform: translate(-50%, -50%) scale(0);
            opacity: 0;
            pointer-events: none;
            animation: rippleSync2 10s infinite;
            z-index: 1;
            filter: blur(2px);
        }

        /* =========================
        GHOST TRAIL ANIMACIÓN
        ========================= */
        @keyframes ghostTrail {

            /* oculto */
            0%, 7%, 45%, 55%, 62%, 100% {
                opacity: 0;
                transform: translate(0,0) scale(1);
            }

            /* movimiento izquierda → derecha */
            15% {
                opacity: 0.25;
                transform: translate(-20px, 0) scale(0.95);
            }

            25% {
                opacity: 0.15;
                transform: translate(-40px, 0) scale(0.9);
            }

            30% {
                opacity: 0.08;
                transform: translate(-60px, 0) scale(0.85);
            }

            /* desaparece */
            40% {
                opacity: 0;
            }

            /* movimiento derecha → izquierda */
            70% {
                opacity: 0.25;
                transform: translate(20px, 0) scale(0.95);
            }

            80% {
                opacity: 0.15;
                transform: translate(40px, 0) scale(0.9);
            }

            85% {
                opacity: 0.08;
                transform: translate(60px, 0) scale(0.85);
            }

            95% {
                opacity: 0;
            }
        }

        /* =========================
        MOVIMIENTO PRINCIPAL
        ========================= */
        @keyframes handDrag {
            0% {
                transform: translate(-150px, -20%) scale(1.2) rotate(-10deg);
                opacity: 0;
            }

            8% {
                transform: translate(-150px, -50%) scale(0.75) rotate(-12deg);
                opacity: 1;
            }

            10% {
                transform: translate(-150px, -50%) scale(0.7) rotate(-12deg);
            }

            15% {
                transform: translate(-120px, -50%) scale(0.9) rotate(-8deg);
            }

            30% {
                transform: translate(120px, -50%) scale(1) rotate(6deg);
            }

            /*  👆🏼 ->  SALE HACIA ABAJO 👇🏼👉🏼 (DERECHA) */
            40% {
                transform: translate(150px, -30%) scale(1.25) rotate(10deg);
                opacity: 1;
            }

            45% {
                transform: translate(150px, 20%) scale(1.3) rotate(10deg);
                opacity: 0;
            }

            /* REAPARECE DESDE ABAJO (DERECHA) */
            55% {
                transform: translate(150px, 20%) scale(1.2) rotate(10deg);
                opacity: 0;
            }

            63% {
                transform: translate(150px, -50%) scale(0.75) rotate(12deg);
                opacity: 1;
            }

            65% {
                transform: translate(150px, -50%) scale(0.7) rotate(12deg);
            }

            70% {
                transform: translate(120px, -50%) scale(0.9) rotate(8deg);
            }

            85% {
                transform: translate(-120px, -50%) scale(1) rotate(-6deg);
            }

            /* 👆🏼 ->  SALE HACIA ABAJO 👇🏼👈🏼(IZQUIERDA) */
            95% {
                transform: translate(-150px, -30%) scale(1.25) rotate(-10deg);
                opacity: 1;
            }

            100% {
                transform: translate(-150px, 20%) scale(1.3) rotate(-10deg);
                opacity: 0;
            }
        }

        /* ========================= RIPPLE PRINCIPAL ========================= */
        @keyframes rippleSync {

            0%, 7%, 44%, 62%, 100% {
                transform: translate(-50%, -50%) scale(0);
                opacity: 0;
            }

            8% {
                transform: translate(-50%, -50%) scale(0.5);
                opacity: 0.9;
            }

            14% {
                transform: translate(-50%, -50%) scale(2.8);
                opacity: 0.5;
            }

            22% {
                transform: translate(-50%, -50%) scale(2.4);
                opacity: 0.4;
            }

            30% {
                transform: translate(-50%, -50%) scale(3.2);
                opacity: 0.2;
            }

            40% {
                transform: translate(-50%, -50%) scale(3.8);
                opacity: 0;
            }

            63% {
                transform: translate(-50%, -50%) scale(0.5);
                opacity: 0.9;
            }

            69% {
                transform: translate(-50%, -50%) scale(2.8);
                opacity: 0.5;
            }

            77% {
                transform: translate(-50%, -50%) scale(2.4);
                opacity: 0.4;
            }

            85% {
                transform: translate(-50%, -50%) scale(3.2);
                opacity: 0.2;
            }

            95% {
                transform: translate(-50%, -50%) scale(3.8);
                opacity: 0;
            }
        }

        /* =========================
        RIPPLE SECUNDARIO
        ========================= */
        @keyframes rippleSync2 {

            0%, 10%, 46%, 64%, 100% {
                transform: translate(-50%, -50%) scale(0);
                opacity: 0;
            }

            10% {
                transform: translate(-50%, -50%) scale(0.4);
                opacity: 0.7;
            }

            18% {
                transform: translate(-50%, -50%) scale(2);
                opacity: 0.3;
            }

            32% {
                transform: translate(-50%, -50%) scale(2.8);
                opacity: 0.1;
            }

            42% {
                opacity: 0;
            }

            65% {
                transform: translate(-50%, -50%) scale(0.4);
                opacity: 0.7;
            }

            73% {
                transform: translate(-50%, -50%) scale(2);
                opacity: 0.3;
            }

            87% {
                transform: translate(-50%, -50%) scale(2.8);
                opacity: 0.1;
            }

            97% {
                opacity: 0;
            }
        }
        
        .loading-text {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-family: 'Arial', sans-serif;
            font-size: 24px;
            z-index: 3;
            transition: opacity 0.5s;
        }
        
        .loading-text {
            text-align: center;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-family: 'Arial', sans-serif;
            font-size: 24px;
            z-index: 3;
            transition: opacity 0.5s;
        }

        /* Clase para activar la animación de abrir ojos */
        .eyes-open #eyelid-top { transform: translateY(-100%); }
        .eyes-open #eyelid-bottom { transform: translateY(100%); }
        .eyes-open .loading-text { opacity: 0; }
    </style>
    <!-- 1. Recursos de Inteligencia Artificial (TensorFlow.js) -->

    <script src="js/tf.min.js" onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/@tensorflow/tfjs/dist/tf.min.js'"></script>

    <script src="js/selfie_segmentation.js" onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js'" crossorigin="anonymous"></script>

    <!-- Importar Three.js desde CDN -->
    <script type="importmap">
        {
            "imports": {
                "three": "./js/three.module.js",
                "three/addons/": "./js/examples/jsm/",
                "three/addons/loaders/GLTFLoader.js": "https://unpkg.com/three@0.160.0/examples/jsm/loaders/GLTFLoader.js",
                "three/addons/loaders/DRACOLoader.js": "https://unpkg.com/three@0.160.0/examples/jsm/loaders/DRACOLoader.js"
            }
        }
    </script>
</head>
<body>
    
    <!-- Pantalla de carga con animación de párpados -->
    <div id="loading-screen">
        <div id="eyelid-top" class="eyelid"></div>
        <center><div class="loading-text" id="loading-text">Despertando en el cumple de Majo...</div></center>
        <div id="eyelid-bottom" class="eyelid"></div>
    </div>

    <!-- Tutorial Interactivo (HTML que faltaba) -->
    <div id="tutorial-hint">
        <div class="hand-animation">
            👆🏼
            <span></span>
        </div>
        <div class="tutorial-text">Desliza para mirar a tu alrededor</div>
    </div>

    <!-- Tutorial de Velas Dinámico (Portado de v37) -->
    <div id="hint-velas">
        <div class="hint-velas-content"></div>
    </div>

    <div id="mensaje-estado"></div>

    <div id="contenedor-canvas"></div>

    <!-- Contenedor del Botón Inicial (En la pared trasera virtualmente, pero botón físico aquí) -->
    <div class="ui-layer">
        <div id="controles-principales">
            <center><button id="boton-modo-foto" class="btn btn-neon">📷 Modo Foto </button></center>
            <div id="controles-resultado">
                <button id="boton-repetir" class="btn">Repetir Foto</button>
                <button id="boton-compartir" class="btn"><img src="svg/icono_compartir.svg" alt="Icono de compartir"> 🎁 Compartir</button>
            </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // Importar el servicio de GitHub
        import { queueUpload, GH_CONFIG } from './js/github-service.js';


        // --- CONFIGURACIÓN BOMBILLO ---
        // Modifica estos valores para mover el bombillo
        const configBombillo = { x: 0, y: 13, z: 5 }; 

        // --- Configuración Escena ---
        const contenedor = document.getElementById('contenedor-canvas');
        const escena = new THREE.Scene();
        escena.background = new THREE.Color(0xffe4e1); // Color de fondo (Rosado pálido)
        // escena.fog = new THREE.Fog(0xffe4e1, 10, 50); // Niebla para suavizar el fondo (DESACTIVADA)

        // --- DETECCIÓN DE DISPOSITIVO Y RENDIMIENTO ---
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        if (isMobile) {
            document.body.classList.add('is-mobile');
            // Escuchar cambios de orientación
            window.addEventListener('orientationchange', actualizarUbicacionCamara);
            screen.orientation?.addEventListener('change', actualizarUbicacionCamara);
        }

        const camara = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
        const renderizador = new THREE.WebGLRenderer({ 
            antialias: !isMobile, // Desactivar antialias en móvil para ganar FPS

        });
        renderizador.setSize(window.innerWidth, window.innerHeight);
        // Sugerencia 3 y 9: Ajustar resolución y pixelRatio en móviles
        renderizador.setPixelRatio(isMobile ? 1 : Math.min(window.devicePixelRatio, 2));
        renderizador.shadowMap.enabled = !isMobile; // Sugerencia 5: Quitar sombras en móviles
        contenedor.appendChild(renderizador.domElement);

        // --- Controles ---
        const controles = new OrbitControls(camara, renderizador.domElement);
        controles.enablePan = false; // Bloquear movimiento lateral de la cámara
        controles.enableZoom = true; // Habilitar zoom (gesto de pellizco)

        // Lógica para ocultar el tutorial al interactuar
        controles.addEventListener('start', () => {
            usuarioInteractuo = true; // Marcamos que el usuario ya sabe mover la cámara
            const hint = document.getElementById('tutorial-hint');

        // Posición inicial
        // Colocamos el target muy cerca de la cámara para que rote sobre su eje
        camara.position.set(0, 5, 15); // X=0 (centro), Y=5 (altura), Z=15 (profundidad)
        controles.target.set(0, 4.8, 14); // Mira ligeramente hacia adelante
        controles.update();

        // --- Iluminación ---
        const luzAmbiental = new THREE.AmbientLight(0xffffff, 0.7); // Luz general suave
        escena.add(luzAmbiental);

        const luzDireccional = new THREE.DirectionalLight(0xffffff, 0.6); // Simula el sol o una lámpara fuerte
        luzDireccional.position.set(8, 15, 10); // Posición de la luz
        luzDireccional.castShadow = !isMobile; // Desactivar generación de sombras en móvil
        escena.add(luzDireccional);

        // Luz cenital (desde arriba)
        const luzFocal = new THREE.SpotLight(0xffffff, 0.8, 50, Math.PI / 4, 0.7, 2);
        luzFocal.position.set(0, 25, -12); // Muy arriba
        luzFocal.target.position.set(0, 0, -12); // Apuntando al centro de la mesa
        luzFocal.castShadow = !isMobile;
        escena.add(luzFocal);
        escena.add(luzFocal.target);

        // Luz de las velas (se crea con cada vela)
        const candleLights = []; // Array para guardar las luces y apagarlas
        const flameMeshes = [];  // Array para guardar las llamas y ocultarlas
        // Variables globales para el reloj
        let manecillaHora = null;
        let manecillaMinuto = null;

        let tapCount = 0; // Contador de toques en el pastel

        // --- Materiales ---
        // Colores en Hexadecimal: 0xRRGGBB (Ej: 0xFF0000 es Rojo)
        const materialMesa = new THREE.MeshStandardMaterial({ color: 0x8B4513, roughness: 0.6 }); // Café madera
        const materialPlato = new THREE.MeshStandardMaterial({ color: 0xf0f0f0, roughness: 0.2 }); // Blanco grisáceo brillante
        // const matVela = new THREE.MeshStandardMaterial({ color: 0xFFFFFF }); // Ya no se usa globalmente
        
        // Función para crear la textura de ondas (Agregada para evitar error de referencia)
        function crearTexturaOndas() {
            const width = 1024;
            const height = 1024;
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            
            // Fondo blanco
            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(0, 0, width, height);
            
            const imgData = ctx.getImageData(0, 0, width, height);
            const data = imgData.data;
            
            const GrosorLineaEnMedioDeCadaOnda = 5;
            const colorLineaEnMedioDeCadaOnda = 0x2C2C2C; // Gris medio
            
            const grosor = 10.0;
            const numOndas = 15.0;
            const frecuencia = 20;
            const amplitud = 8;
            const colorGris = 220;
            const spacing = height / numOndas;

            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    const nx = (x / width) * Math.PI * 2 * frecuencia;
                    const waveOffset = Math.sin(nx) * amplitud;
                    let distY = (y - waveOffset) % spacing;
                    if (distY < 0) distY += spacing;
                    let dist = Math.min(distY, spacing - distY);
                    if (dist < grosor) {
                        const factor = dist / grosor;
                        const val = colorGris + (255 - colorGris) * factor;
                        const idx = (y * width + x) * 4;
                        data[idx] = val; data[idx+1] = val; data[idx+2] = val;
                    }
                }
            }
            ctx.putImageData(imgData, 0, 0);
            const tex = new THREE.CanvasTexture(canvas);
            tex.colorSpace = THREE.SRGBColorSpace;
            return tex;
        }

        const materialParedOndas = new THREE.MeshStandardMaterial({ 
            map: crearTexturaOndas(),
            side: THREE.BackSide,
            color: 0xFFFFFF,   // Forzar color blanco
            roughness: 0.005,    // Copiado de los globos
            metalness: 0.005,     // Reducido para que no se vea negro
        });
        const materialParedPlana = new THREE.MeshStandardMaterial({ color: 0xFFFFFF, side: THREE.BackSide }); // las demas paredes son blancas
        const materialParedAzulejo = new THREE.MeshStandardMaterial({ color: 0xE0F7FA, side: THREE.BackSide, roughness: 0.1, metalness: 0.1 }); // Brillante
        const materialTecho = new THREE.MeshStandardMaterial({ color: 0xffffff, side: THREE.BackSide });
        
        const materialesHabitacion = [
            materialParedAzulejo, // Derecha
            materialParedPlana, // Izquierda
            materialTecho, // Arriba (Techo)
            materialParedPlana, // Abajo (Suelo invisible)
            materialParedAzulejo, // Frente (Pared de enfrente)
            materialParedOndas  // Atrás
        ];

        // --- Listas para optimización de animación ---
        const globosAnimados = [];
        const llamasAnimadas = [];

        // --- Objetos 3D ---

        // 1. Habitación (Caja grande invertida)
        // Bajamos la altura para que el techo se vea más cerca (pegado a las bombas)
        // Altura 25. Suelo en -10.1. Techo en -10.1 + 25 = 14.9
        const geoHabitacion = new THREE.BoxGeometry(40, 25, 40);
        const habitacion = new THREE.Mesh(geoHabitacion, materialesHabitacion);
        habitacion.position.y = 2.4; // Ajustado: (25/2) - 10.1 = 12.5 - 10.1 = 2.4 para que el suelo siga en -10.1
        habitacion.receiveShadow = !isMobile;
        escena.add(habitacion);

        // 2. Mesa
        const grupoMesa = new THREE.Group();
        
        // Material de Vidrio para la parte superior
        const materialVidrio = new THREE.MeshPhysicalMaterial({
            color: 0xffffff, // Color base
            metalness: 0.1,
            roughness: 0.05, // Muy liso
            transmission: 0.9, // Permite que la luz pase a través (vidrio)
            thickness: 0.5,
            transparent: true,
            opacity: 0.7
        });

        // Tablero cuadrado de la mesa (10 ancho x 10 profundo)
        const geoTableroMesa = new THREE.BoxGeometry(14, 0.4, 14); // Mesa más grande
        const tableroMesa = new THREE.Mesh(geoTableroMesa, materialVidrio); // Usamos el material de vidrio
        tableroMesa.position.y = 5.45; // Altura del tablero (ajustado sobre bases)
        tableroMesa.receiveShadow = false; // El vidrio no suele recibir sombras duras
        tableroMesa.castShadow = !isMobile; // Pero si proyecta (aunque tenue)
        grupoMesa.add(tableroMesa);

        // 2 Patas en el centro con espacio entre si
        const geoPata = new THREE.BoxGeometry(1, 5, 5); // Grosor y altura de las patas
        const matPata = new THREE.MeshStandardMaterial({color: 0x5c4033}); // Color madera oscura
        const geoSoportePatas = new THREE.BoxGeometry(3, 1, 5); // Grosor y altura del soporte de las patas
        // El soporte de las patas es un restangulo horizontal que une las 2 patas de la mesa
        const soportePatas = new THREE.Mesh(geoSoportePatas, matPata); 
        // Ubicamos el soporte donde corresponde uniendo las patas en la mitad de su altura
        soportePatas.position.set(0, 2.5, 0); // Centrado verticalmente respecto a las patas (0-5)
        grupoMesa.add(soportePatas);

        const geoBasesPatas = new THREE.BoxGeometry(1.5, 0.5, 5); // Grosor y altura del soporte de las patas
        // El soporte de las patas es un rectangulo horizontal que une las 2 patas de la mesa
        const basesPatas = new THREE.Mesh(geoBasesPatas, matPata); 
        // Coordenadas [X, Y, Z] para las 4 bases de las patas
        const posicionesBasesPatas = [[-2, 0, 0], [2, 0, 0], [-2, 5, 0], [2, 5, 0]];
        posicionesBasesPatas.forEach(pos => {
            const base = new THREE.Mesh(geoBasesPatas, matPata);
            base.position.set(pos[0], pos[1], pos[2]);
            base.castShadow = !isMobile;
            base.receiveShadow = !isMobile;
            grupoMesa.add(base);
        });
        
        // Coordenadas [X, Y, Z] para las 2 patas
        const posicionesPatas = [[-2, 2.5, 0], [2, 2.5, 0]]; // Elevadas a 2.5 para cubrir de 0 a 5
        posicionesPatas.forEach(pos => {
            const pata = new THREE.Mesh(geoPata, matPata);
            pata.position.set(pos[0], pos[1], pos[2]);
            pata.castShadow = !isMobile;
            pata.receiveShadow = !isMobile;
            grupoMesa.add(pata);
        });

        // 3. Plato
        const geoPlato = new THREE.CylinderGeometry(3.5, 3, 0.4, 32); // Geometría para un plato plano
        // Lo subimos para que quede encima de la superficie de la mesa
        geoPlato.translate(0, 5.775, 0); // Ajustado a la nueva altura de la mesa
        const objetoPlato = new THREE.Mesh(geoPlato, materialPlato);
        objetoPlato.receiveShadow = !isMobile;
        grupoMesa.add(objetoPlato); // ¡Importante! Añadir el plato al grupo de la mesa

        // Corregimos la posición de la mesa para que su base esté en el suelo (y=0)
        // Modifica 'z' (-12) para mover la mesa más cerca o lejos
        grupoMesa.position.set(0, -10.1, -12); // Bajada para tocar el suelo (suelo en -10.1 local)
        escena.add(grupoMesa);

        // 4. Pastel (Nueva Versión con LOD para optimización móvil)
        const grupoPastel = new THREE.Group();
        grupoPastel.position.set(0, -4.15, -12);

        function crearFrutosRelieve(toppingRadius) {
            const numFrutos = isMobile ? 0 : 50; // No frutos en móvil
            const frutoColorBase = 0x740016; // Rojo oscuro
            const matFruto = new THREE.MeshStandardMaterial({
                color: frutoColorBase,
                // Fuerza un brillo leve casi propio independiente del brillo ambiental de rojo
                emissive: 0x550000, // brillo rojo
                roughness: Math.random() * (0.3 - 0.1) + 0.1,
                metalness: 0.4, // Reflexión
                // Aumenta la reflexion de la luz que llega al objeto
                envMapIntensity: 3 // prueba entre 1 y 3
            });
            
            // Frutos son como esferas aplastadas
            const geoFruto = new THREE.SphereGeometry(0.1, 11, 11);

            for (let i = 0; i < numFrutos; i++) {
                const angle = Math.random() * Math.PI * 2;
                const dist = Math.random() * (toppingRadius - 0.3); // No tocar el borde
                const colorVariacion = (Math.random() - 0.5) * 0.1; // Variación sutil del color

                const matFrutoVar = matFruto.clone();
                const color = new THREE.Color(frutoColorBase).offsetHSL(0, 0, colorVariacion);
                matFrutoVar.color.copy(color);

                const mallaFruto = new THREE.Mesh(geoFruto, matFrutoVar);
                mallaFruto.scale.set(1, 0.5, 1); // Aplicar aplastamiento
                mallaFruto.position.set(Math.cos(angle) * dist, 2.06, Math.sin(angle) * dist); 
                mallaFruto.castShadow = true;
                grupoPastel.add(mallaFruto);
            }
        }

        const radioCuerpo = 2.5;
        const alturaCuerpo = 2.0; 
        const matCuerpoLiso = new THREE.MeshStandardMaterial({ 
            color: 0xFFFBED, // Crema/Blanco amarillento
            roughness: isMobile ? 0.9 : 0.6,
        });

        // Cuerpo del Pastel con Relieve Irregular (Mucho más liviano que usar mallas separadas)
        const geoPastel = new THREE.CylinderGeometry(
            radioCuerpo, 
            radioCuerpo, 
            alturaCuerpo, 
            isMobile ? 32 : 128, // Más segmentos para un relieve suave
            isMobile ? 2 : 24    // Segmentos de altura
        ); 

        // Aplicar protuberancias y relieve aleatorio directamente a los vértices
        if (!isMobile) {
            const posAttr = geoPastel.attributes.position;
            const vTemp = new THREE.Vector3();
            for (let i = 0; i < posAttr.count; i++) {
                vTemp.fromBufferAttribute(posAttr, i);
                
                // Deformar solo superficie lateral y superior (evitar base para que no flote)
                if (vTemp.y > -(alturaCuerpo / 2) + 0.05) {
                    const protu = Math.random() * 0.12; // Intensidad del relieve lateral
                    const ang = Math.atan2(vTemp.z, vTemp.x);
                    if (Math.abs(vTemp.x) > 0.1 || Math.abs(vTemp.z) > 0.1) {
                        vTemp.x += Math.cos(ang) * protu;
                        vTemp.z += Math.sin(ang) * protu;
                    }
                    // Subidas y bajadas aleatorias
                    vTemp.y += (Math.random() - 0.5) * 0.1;
                    posAttr.setXYZ(i, vTemp.x, vTemp.y, vTemp.z);
                }
            }
            geoPastel.computeVertexNormals();
        }

        const cuerpoPastel = new THREE.Mesh(geoPastel, matCuerpoLiso);
        cuerpoPastel.position.y = alturaCuerpo / 2; // Pivote en la base
        cuerpoPastel.castShadow = !isMobile;
        grupoPastel.add(cuerpoPastel);

        // Decoración superior (Dona blanca gruesa)
        const radioTorus = 2.35; 
        const grosorTorus = 0.2; 
        const geoTorus = new THREE.TorusGeometry(radioTorus, grosorTorus, 16, isMobile ? 32 : 50); 
        geoTorus.rotateX(Math.PI / 2); 
        const matTorus = new THREE.MeshBasicMaterial({ color: 0xD6D4CC }); 
        const donaDecoracion = new THREE.Mesh(geoTorus, matTorus);
        donaDecoracion.position.y = alturaCuerpo; 
        grupoPastel.add(donaDecoracion);

        // Salsa de frutos rojos
        const geoSalsa = new THREE.CircleGeometry(2.3, isMobile ? 32 : 50); 
        geoSalsa.rotateX(-Math.PI / 2); 
        const matSalsa = new THREE.MeshStandardMaterial({ 
            color: 0xC40322, 
            // Fuerza un brillo leve casi propio independiente del brillo ambiental de rojo
            emissive: 0x550000, // brillo rojo
            roughness: Math.random() * (0.3 - 0.1) + 0.1,
            metalness: 0.4, 
            // Aumenta la reflexion de la luz que llega al objeto
            envMapIntensity: 3 // prueba entre 1 y 3
        });
        const salsaFrutosRojos = new THREE.Mesh(geoSalsa, matSalsa);
        salsaFrutosRojos.position.y = alturaCuerpo + 0.05; 
        grupoPastel.add(salsaFrutosRojos);

        if (!isMobile) {
            crearFrutosRelieve(2.3);
        }
        escena.add(grupoPastel);

        // Decoraciones de Fiesta (Globos)
        function crearGlobo(color, position, targetPosition) {
            const grupoGlobo = new THREE.Group();
            const matGlobo = new THREE.MeshStandardMaterial({
                color: color,
                roughness: 0.1,
                metalness: 0.5,
            });
            const cuerpo = new THREE.Mesh(new THREE.SphereGeometry(1.5, 32, 32), matGlobo);
            cuerpo.scale.y = 1.2; // Hacerlo un poco ovalado (forma de huevo)
            grupoGlobo.add(cuerpo);

            // El nudo del globo
            const nudo = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 0.2, 12), matGlobo);
            nudo.position.y = -1.5;
            grupoGlobo.add(nudo);

            // Cuerda
            let cuerdaMesh = null;
            if (targetPosition) {
                // Crear la cuerda como un objeto independiente en la escena para poder estirarla
                const geoCuerda = new THREE.CylinderGeometry(0.02, 0.02, 1);
                geoCuerda.translate(0, 0.5, 0); // Mover pivote a la base para facilitar escalado (aunque usaremos centro y escala)
                const matCuerda = new THREE.MeshBasicMaterial({ color: 0xFFFFFF });
                cuerdaMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 1), matCuerda);
                escena.add(cuerdaMesh);
            }

            grupoGlobo.position.copy(position);
            escena.add(grupoGlobo);
            // Guardamos para animar en el loop principal
            globosAnimados.push({
                grupo: grupoGlobo,
                yInicial: position.y,
                xOffset: position.x,
                target: targetPosition,
                cuerda: cuerdaMesh
            });
        }
        
        const llamasParaAnimar = [];
        let iaCargada = false;

        function actualizarGlobos(tiempo) {
            globosAnimados.forEach(g => {
                // Solo animamos el "flote" en PC para ahorrar batería/recursos en móvil
                if (!isMobile) {
                    g.grupo.position.y = g.yInicial + Math.sin(tiempo + g.xOffset) * 0.5;
                    g.grupo.rotation.z = Math.sin(tiempo * 0.5) * 0.05;
                }

                // La cuerda debe actualizar su posición SIEMPRE (al menos una vez) 
                // para que no aparezca en el centro de la escena
                if (g.cuerda && g.target) {
                    const posNudo = g.grupo.position.clone();
                    posNudo.y -= 1.5;
                    const distancia = posNudo.distanceTo(g.target);
                    const puntoMedio = posNudo.clone().add(g.target).multiplyScalar(0.5);
                    
                    // Mover cuerda al punto medio
                    g.cuerda.position.copy(puntoMedio);
                    // Orientar hacia el nudo
                    g.cuerda.lookAt(posNudo); 
                    // Rotar 90 grados en X porque CylinderGeometry está orientado en Y por defecto
                    g.cuerda.rotateX(Math.PI / 2);
                    // Escalar para cubrir la distancia
                    g.cuerda.scale.set(1, distancia, 1);
                }
            });
        }
        
        // 6. Regalos encima de la mesa
        // Definimos posiciones relativas a la mesa (que está en 0, -10.1, -12)
        const posMesa = new THREE.Vector3(0, -10.1, -12);

        // Helper para calcular posición global de un regalo
        function getRegaloGlobalPos(localPos) {
            return new THREE.Vector3(
                posMesa.x + localPos.x,
                posMesa.y + localPos.y, // Altura de la mesa + altura local regalo
                posMesa.z + localPos.z
            );
        }

        function crearRegalo(color, colorListon, position, tamano) {
            const grupoRegalo = new THREE.Group();
            // Caja del regalo
            const geoCaja = new THREE.BoxGeometry(tamano, tamano, tamano);
            const matCaja = new THREE.MeshStandardMaterial({ color: color });
            const caja = new THREE.Mesh(geoCaja, matCaja);
            caja.castShadow = true;
            caja.receiveShadow = true;
            grupoRegalo.add(caja);
            // Listones decorativos
            const matListon = new THREE.MeshStandardMaterial({ color: colorListon });
            // Listón horizontal
            const liston1 = new THREE.Mesh(new THREE.BoxGeometry(tamano + 0.05, tamano * 0.15, tamano + 0.05), matListon);
            // Listón vertical
            const liston2 = new THREE.Mesh(new THREE.BoxGeometry(tamano * 0.15, tamano + 0.05, tamano + 0.05), matListon);
            grupoRegalo.add(liston1, liston2);
            
            grupoRegalo.position.copy(position);
            grupoMesa.add(grupoRegalo); // Añadido al grupo de la mesa para que se mueva con ella
        }
        // Crear los regalos. Posiciones (X, Y, Z) son RELATIVAS al centro de la mesa
        // X: -izquierda / +derecha
        // Y: altura (3.7 aprox para estar sobre la mesa)
        // Z: -atrás / +adelante
        
        // Posiciones locales de los regalos
        const posR1 = new THREE.Vector3(-5.5, 8.4, -5.5); // Más afuera
        const posR2 = new THREE.Vector3(5.5, 6.75, -5.0); // Más afuera

        // --- Ventana y Puerta (Pared Izquierda X = -20) ---
        // zPos: posición en profundidad
        // yPos: altura
        // ancho, alto: dimensiones
        // tipo: 'ventana' o 'puerta'
        function crearElementoPared(zPos, yPos, ancho, alto, tipo) {
            const grupo = new THREE.Group();
            const colorMarco = 0xE0E0E0; // Marco de madera (blanco hueso para contraste)
            
            // Marco exterior
            const geoMarcoH = new THREE.BoxGeometry(0.5, 0.5, ancho + 0.5); // Se extiende para cubrir las esquinas
            const geoMarcoV = new THREE.BoxGeometry(0.5, alto - 0.5, 0.5); // Se acorta para caber entre los horizontales
            const matMarco = new THREE.MeshStandardMaterial({ color: colorMarco });
            
            const marcoSuperior = new THREE.Mesh(geoMarcoH, matMarco);
            marcoSuperior.position.y = (alto - 0.5) / 2;
            grupo.add(marcoSuperior);
            if (tipo !== 'puerta') {
                const marcoInferior = new THREE.Mesh(geoMarcoH, matMarco);
                marcoInferior.position.y = -(alto - 0.5) / 2;
                grupo.add(marcoInferior);
            }
            const marcoIzquierdo = new THREE.Mesh(geoMarcoV, matMarco);
            marcoIzquierdo.position.z = -ancho / 2; // Centrado en el borde
            const marcoDerecho = new THREE.Mesh(geoMarcoV, matMarco);
            marcoDerecho.position.z = ancho / 2; // Centrado en el borde
            
            grupo.add(marcoIzquierdo, marcoDerecho);

            if (tipo === 'ventana') {
                // Ventana: Cristal y división vertical
                // Material de vidrio con reflexión (MeshPhysicalMaterial para mejor efecto)
                const matVidrio = new THREE.MeshPhysicalMaterial({
                    color: 0x87CEEB,
                    metalness: 0.1,
                    roughness: 0.05,
                    transmission: 0.2, // Un poco transparente
                    transparent: true,
                    opacity: 0.6,
                    reflectivity: 0.8,
                    clearcoat: 1.0,
                    side: THREE.DoubleSide
                });

                const geoCristal = new THREE.PlaneGeometry(ancho - 0.5, alto - 0.5);
                const mallaCristal = new THREE.Mesh(geoCristal, matVidrio); // Cielo azul con reflejo
                mallaCristal.rotation.y = Math.PI / 2;
                grupo.add(mallaCristal);

                // División Vertical
                const divisor = new THREE.Mesh(new THREE.BoxGeometry(0.3, alto, 0.2), matMarco);
                grupo.add(divisor);

                // Anjeo (Mosquitero) en el vidrio izquierdo
                // El vidrio está en el plano X local. Ancho es Z. Izquierda es Z negativo.
                // Creamos un plano para el anjeo en la mitad izquierda
                const geoAnjeo = new THREE.PlaneGeometry((ancho - 0.5) / 2, alto - 0.5);
                
                // Textura de rejilla para el anjeo
                const canvasAnjeo = document.createElement('canvas');
                canvasAnjeo.width = 64; canvasAnjeo.height = 64;
                const ctxAnjeo = canvasAnjeo.getContext('2d');
                ctxAnjeo.fillStyle = 'rgba(0,0,0,0)'; ctxAnjeo.fillRect(0,0,64,64); // Transparente
                ctxAnjeo.strokeStyle = 'rgba(30,30,30,0.7)'; ctxAnjeo.lineWidth = 2; // Rejilla oscura
                const step = 16;
                for(let i=0; i<64; i+=step) {
                    ctxAnjeo.beginPath(); ctxAnjeo.moveTo(i,0); ctxAnjeo.lineTo(i,64); ctxAnjeo.stroke();
                    ctxAnjeo.beginPath(); ctxAnjeo.moveTo(0,i); ctxAnjeo.lineTo(64,i); ctxAnjeo.stroke();
                }
                const texAnjeo = new THREE.CanvasTexture(canvasAnjeo);
                texAnjeo.wrapS = THREE.RepeatWrapping; texAnjeo.wrapT = THREE.RepeatWrapping;
                texAnjeo.repeat.set(20, 40);

                const matAnjeo = new THREE.MeshBasicMaterial({ map: texAnjeo, transparent: true, side: THREE.DoubleSide });
                const mallaAnjeo = new THREE.Mesh(geoAnjeo, matAnjeo);
                mallaAnjeo.rotation.y = Math.PI / 2;
                mallaAnjeo.position.x = 0.1; 
                // MOVIDO: A la "otra ventanada" (lado derecho, Z positivo local)
                mallaAnjeo.position.z = (ancho - 0.5) / 4; 
                grupo.add(mallaAnjeo);

            } else if (tipo === 'puerta') {
                // Puerta: Panel de madera con patrón
                const panelPuerta = new THREE.Group();
                const numColumnas = 11;
                const anchoColumna = (ancho - 0.5) / numColumnas;
                const altoPuerta = alto - 0.5;
                const matPuerta = new THREE.MeshStandardMaterial({color: 0xFFFCF2}); // Color principal
                const matPuertaHundida = new THREE.MeshStandardMaterial({color: 0xE6E3DA}); // Color más oscuro para ranuras

                for (let i = 0; i < numColumnas; i++) {
                    // Las columnas pares (0, 2, 4) sobresalen, las impares (1, 3) están hundidas.
                    const esSalida = i % 2 === 0;
                    const profundidadColumna = esSalida ? 0.2 : 0.1; // Las hundidas son más delgadas
                    // Para que el frente de la puerta sea plano, movemos las partes hundidas hacia atrás.
                    const posXColumna = esSalida ? 0 : -0.05;

                    const geoColumna = new THREE.BoxGeometry(profundidadColumna, altoPuerta, anchoColumna);
                    const materialColumna = esSalida ? matPuerta : matPuertaHundida;
                    const columna = new THREE.Mesh(geoColumna, materialColumna);

                    // Habilitar que cada parte de la puerta proyecte y reciba sombras
                    columna.castShadow = !isMobile;
                    columna.receiveShadow = !isMobile;
                    
                    columna.position.x = posXColumna;
                    columna.position.z = -((ancho - 0.5) / 2) + (i * anchoColumna) + (anchoColumna / 2);
                    
                    panelPuerta.add(columna);
                }
                grupo.add(panelPuerta);
                
                // Manija nueva
                const grupoManija = new THREE.Group();
                const matManija = new THREE.MeshStandardMaterial({color: 0xE6E3DA, metalness: 0.5, roughness: 0.2});

                // Placa cerradura ("circular")
                const geoPlacaCerradura = new THREE.CylinderGeometry(0.25, 0.25, 0.2, 20);
                const placaCerradura = new THREE.Mesh(geoPlacaCerradura, matManija);
                placaCerradura.rotateX(Math.PI / 2); // Para que apunte hacia afuera
                placaCerradura.rotateZ(Math.PI / 2); // Para que apunte hacia afuera)
                placaCerradura.position.x = 0;
                placaCerradura.position.y = 0.07;
                placaCerradura.position.z = -5;
                grupoManija.add(placaCerradura);

                // Parte redonda para la llave
                const geoCerradura = new THREE.CylinderGeometry(0.07, 0.07, 0.25, 20);
                geoCerradura.rotateZ(Math.PI / 2); // Para que apunte hacia afuera
                const matCerradura = new THREE.MeshStandardMaterial({color: 0x111111, metalness: 1.0, roughness: 0.2});
                const cerradura = new THREE.Mesh(geoCerradura, matCerradura);
                cerradura.position.x = 0.05;
                cerradura.position.y = 0.15;
                cerradura.position.z = -5;
                grupoManija.add(cerradura);

                // Ranura para la llave
                const geoRanura = new THREE.BoxGeometry(0.3, 0.2, 0.05);
                const matRanura = new THREE.MeshBasicMaterial({color: 0x111111});
                const ranura = new THREE.Mesh(geoRanura, matRanura);
                ranura.position.x = 0.06;
                ranura.position.z = -5;
                grupoManija.add(ranura);

                const grupoAgarraderaManijaNueva = new THREE.Group();
                // --- 1. MATERIAL METÁLICO (con un poco más de brillo para resaltar las curvas) ---
                const matAgarradera = new THREE.MeshStandardMaterial({
                    color: 0xE6E3DA, // Un blanco un poco oscuro
                    metalness: 0.5,  // Metal completo
                    roughness: 0.1   // Muy pulido
                });

                // --- 2. DEFINICIÓN DE PUNTOS PARA UNA GEOMETRÍA ESCULTURAL ---
                // Añadimos puntos extra (2b, 2c, 5b, 6b) para definir curvas perfectas
                const puntosCurva = [
                    new THREE.Vector3(0, 0.8, 0),         // 1. Inicio Superior (Anclado)
                    new THREE.Vector3(0.15, 0.75, 0),     // 2. Salida suave desde arriba
                    new THREE.Vector3(0.40, 0.65, 0),     // 2b. PUNTO EXTRA: Redondea la parte superior de la barriga
                    new THREE.Vector3(0.50, 0.45, 0),     // 2c. PUNTO EXTRA: El cénit de la barriga (bien definida)
                    new THREE.Vector3(0.40, 0.25, 0),     // 2d. PUNTO EXTRA: Redondea la parte inferior de la barriga
                    new THREE.Vector3(0.15, -0.1, 0),     // 3. Transición bajando
                    new THREE.Vector3(0, -0.45, 0),       // 4. UNIÓN BAJA (Anclado)
                    new THREE.Vector3(0.04, -0.55, 0),    // 5. Salida suave desde la unión
                    new THREE.Vector3(0.1, -0.65, 0),    // 5b. PUNTO EXTRA: Define la curva hacia afuera
                    new THREE.Vector3(0.13, -0.7, 0),    // 6. El punto más salido de la curva final
                    new THREE.Vector3(0.25, -0.88, 0)     // 6b. FIN: Curva sutil hacia adentro, sin tocar la puerta
                ];

                // --- 3. CREACIÓN DE LA CURVA (con suavizado extra) ---
                const curvaAgarradera = new THREE.CatmullRomCurve3(puntosCurva);
                curvaAgarradera.tension = 0.4; // Bajamos un poco la tensión para curvas más orgánicas

                // Geometría de tubo (Aumentamos segmentos para que la curva sea perfecta)
                const tubularSegments = 200; // Más segmentos para curvas ultra suaves
                const radioTubo = 0.1;      // Grosor constante
                const geoAgarradera = new THREE.TubeGeometry(curvaAgarradera, tubularSegments, radioTubo, 16, false);
                const mallaAgarradera = new THREE.Mesh(geoAgarradera, matAgarradera);
                mallaAgarradera.castShadow = !isMobile;
                grupoAgarraderaManijaNueva.add(mallaAgarradera);

                // --- 4. SOPORTES ---
                const geoSoporte = new THREE.CylinderGeometry(0.05, 0.07, 0.06, 16);

                // Soporte Superior
                const soporteSup = new THREE.Mesh(geoSoporte, matAgarradera);
                soporteSup.position.set(0, 0.8, 0);
                soporteSup.rotateZ(Math.PI / 2);

                // Soporte Inferior (Ajustado a la unión -0.45)
                const soporteBajo = new THREE.Mesh(geoSoporte, matAgarradera);
                soporteBajo.position.set(0, -0.45, 0); 
                soporteBajo.rotateZ(Math.PI / 2);

                grupoAgarraderaManijaNueva.add(soporteSup, soporteBajo);

                // --- 5. POSICIÓN FINAL ---
                grupoAgarraderaManijaNueva.position.set(0, -1.1, -5);

                // Agregar al grupo de la puerta
                grupoManija.add(grupoAgarraderaManijaNueva);
                grupoManija.position.set(0.1, 0, ancho/2 - 1.48);
                grupo.add(grupoManija);
            }

            // Posicionar en la pared izquierda (X ~ -19.8 para que sobresalga un poco)
            grupo.position.set(-19.8, yPos, zPos); 
            escena.add(grupo);
        }
